      if (!t) return;
      if (t.tagName === "DETAILS") t.open = true;
      t.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    };
    prog.append(b);
  });
}

function buildBuildTab(body, p, s) {
  /* --- ① the board: this page's colours, in whichever arrangement reads best today --- */
  const { cols, flat } = p ? ramps(p.colors) : { cols: [], flat: false };
  const view = boardView();
  const eff = view === "ramps" && flat ? "grid" : view;
  const chosen = (s.core ? 1 : 0) + s.accent.length;
  const lab = el("p", "lab", `<span>① Core &amp; accents</span>`);
  lab.dataset.stage = "b1";
  const tally = el("span", "tally");
  tally.textContent = p ? `${chosen}/${p.colors.length} · ${s.out.length} out` : "";
  lab.append(tally);
  if (p) {
    const bv = el("span", "themes");
    BOARD_VIEWS.forEach((v) => {
      const b = el("button", "chip");
      b.textContent = v;
      b.dataset.k = "bv" + v;
      b.setAttribute("aria-pressed", String(view === v));
      if (v === "ramps" && flat) { b.disabled = true; b.title = "this palette is one long ramp — no columns to split into"; }
      b.onclick = () => { ui.board = v; saveUI(); renderRail(); };
      bv.append(b);
    });
    lab.append(bv);
  }
  body.append(lab);
  body.append(el("p", "sr", "Click a swatch to toggle it as an accent, or its top edge to make it the core. With a swatch focused: C sets the core, Enter toggles an accent, X eliminates it. In the system list further down, arrow keys reorder an accent and X removes it."));

  if (eff === "list") {
    const rows = el("div", "blist");
    (p ? p.colors : []).forEach((c) => rows.append(listRow(s, c)));
    body.append(rows);
  } else {
    const board = el("div", "board" + (eff === "large" ? " big" : ""));
    const groups = eff === "ramps" ? cols.map((c) => c.cs)
      : chunk(p ? p.colors : [], Math.ceil((p?.colors.length || 1) / (eff === "large" ? 5 : 9)));
    board.style.setProperty("--rows", Math.max(1, ...groups.map((g) => g.length)));
    groups.forEach((cs) => {
      const col = el("div", "col");
      cs.forEach((c) => col.append(cellFor(s, c, eff === "large")));
      board.append(col);
    });
    body.append(board);
  }

  const acts = el("p", "lab");
  /* the board only holds this page. An accent can come from any of the other 201, and the button that
     lends it lives on a grid card — so this steps the rail aside rather than opening a second board. */
  const pick = el("button", "act");
  pick.dataset.k = "pick";
  pick.textContent = "Draw from another page";
  pick.onclick = () => { picking = true; drawFrom = null; render(); };
  acts.append(pick);
  const elim = el("button", "act");
  elim.dataset.k = "elim";
  const openCount = p ? p.colors.filter((c) => roleOf(s, c) === "open").length : 0;
  elim.textContent = openCount ? `Eliminate the rest (${openCount})` : s.out.length ? "Restore eliminated" : "";
  elim.onclick = () => {
    if (openCount) withUndo(`${openCount} eliminated`, () => {
      open.out = [...new Set([...open.out, ...p.colors.filter((c) => roleOf(open, c) === "open")])];
    });
    else withUndo("eliminated restored", () => { open.out = []; });
  };
  if (elim.textContent) acts.append(elim);
  body.append(acts);

  /* --- the system so far: core + every accent, including ones borrowed from pages this board
         can't show. The one surface where a build is listed whole — reordered, or picked apart. --- */
  const tl = el("p", "lab", "<span>System</span>");
  const tacts = el("span", "pctrls");
  if (Array.isArray(s.order) && s.order.length) {
    const d = el("button", "act");
    d.dataset.k = "dord";
    d.textContent = "derived order";
    d.title = "drop the dragged order and let the board decide again";
    d.onclick = () => { open.order = null; persistSystems(); flipTray(renderRail); };
    tacts.append(d);
  }
  if (chosen || s.out.length || s.neutral || Object.keys(s.roles).length) {
    const rb = el("button", "act");
    rb.dataset.k = "rsb";
    rb.textContent = "reset build";
    rb.onclick = () => withUndo("build reset", () => Object.assign(open,
      { core: null, accent: [], src: {}, out: [], neutral: null, roles: {}, order: null }));
    tacts.append(rb);
  }
  if (tacts.childNodes.length) tl.append(tacts);
  body.append(tl, trayFor(s));

  /* --- ② neutral: five live pages, not five strips. Each tile is this system in that scale —
     her role overrides and her theme, so what she compares is what she would ship. --- */
  const nlab = el("p", "lab", "<span>② Neutral palette</span>");
  nlab.dataset.stage = "b2";
  body.append(nlab);
  const neuts = el("div", "neuts");
  NEUTRALS.forEach((n) => {
    const r = system(p, { ...s, neutral: n.name }).roles;
    const b = el("button", "neut",
      `<b>${n.name}</b><i class="h"></i><i></i><i class="s"></i>${s.core ? '<i class="c"></i>' : ""}`);
    b.style.cssText = `--t-bg:${r.bg};--t-surface:${r.surface};--t-line:${r.border};` +
      `--t-ink:${r.text};--t-mut:${r["text-muted"]}` + (s.core ? `;--t-core:${s.core}` : "");
    b.dataset.k = "n" + n.name;
    b.setAttribute("aria-pressed", String(s.neutral === n.name));
    /* no deselect: a system without a neutral has nothing to look at, so "none" is only ever a start state */
    b.onclick = () => { s.neutral = n.name; persistSystems(); renderRail(); };
    neuts.append(b);
  });
  body.append(neuts);

  /* --- role ladder: 55 buttons that are inert whenever every pairing passes, so it opens itself
     only when it has something to say — a failure to fix, or an override already in play --- */
  if (neutralOf(s)) {
    const bad = failing(s), moved = Object.keys(s.roles).length;
    const d = el("details", "roles");
    d.dataset.stage = "b3";
    d.open = !!(bad.length || moved);
    const sum = el("summary", "lab",
      `<span>③ Roles</span><span class="tally">${bad.length ? `${bad.length} below AA` : "all pass"}${
        moved ? ` · ${moved} moved` : ""}</span>`);
    if (moved) {
      const r = el("button", "act"); r.dataset.k = "reset"; r.textContent = "reset all";
      /* inside a summary, a click would toggle the disclosure as well as reset */
      r.onclick = (e) => { e.preventDefault(); e.stopPropagation(); withUndo("roles reset", () => { open.roles = {}; }); };
      sum.append(r);
    }
    d.append(sum, rampStrip(s), ladder(s));
    body.append(d);
  }

  /* --- theme + preview: its own pane below the scroller, not the last thing in it. The preview is
     ~800px of page; at the end of the controls you had to scroll away from every control to see it,
     and pinning it with position:sticky just covered whatever sat in the gap. A sibling pane keeps
     it in shot while the board, the tiles and the ladder scroll independently above. --- */
  const pane = $("#rPrevPane");
  const pl = el("p", "lab", "<span>Preview</span>");
  const ctrls = el("span", "pctrls");
  const views = el("span", "themes");
  Object.keys(TEMPLATES).forEach((v) => {
    const b = el("button", "chip"); b.textContent = v; b.dataset.k = "pv" + v;
    b.setAttribute("aria-pressed", String(previewTpl() === v));
    b.onclick = () => { ui.tpl = v; saveUI(); renderRail(); };
    views.append(b);
  });
  ctrls.append(views);
  const th = el("span", "themes");
  ["light", "dark"].forEach((t) => {
    const b = el("button", "chip"); b.textContent = t; b.dataset.k = "th" + t;
    b.setAttribute("aria-pressed", String(!!s.dark === (t === "dark")));
    b.onclick = () => { s.dark = t === "dark"; persistSystems(); renderRail(); };
    th.append(b);
  });
  ctrls.append(th);
  pl.append(ctrls);
  pane.append(pl);

  if (s.core && neutralOf(s)) {
    const node = TEMPLATES[previewTpl()].make(p, s);
    node.id = "rPrev";
    pane.append(node);
    /* a role that just moved shows itself: the regions that read it pulse once */
    if (flashRole) pane.querySelectorAll(`[data-drop="role:${flashRole}"]`).forEach((n) => {
      n.classList.add("flash");
      n.addEventListener("animationend", () => n.classList.remove("flash"), { once: true });
    });
  } else {
    pane.append(el("p", "unbuilt", "Pick a core colour and a neutral palette"));
  }
  flashRole = null;

  /* --- export, collapsed to its first line until export is the task --- */
  const sys = system(p, s);
  const sum = el("button", "exsum", `<b>Export · ${dlgFormat}</b><code>${
    esc(FORMATS[dlgFormat].make(sys).split("\n").find((l) => l.trim()) || "—")
  }</code>`);
  sum.onclick = () => { tab = "export"; renderRail(); };
  body.append(sum);

  $("#rAct").innerHTML = "";
  const link = el("button", "btn ghost"); link.textContent = "Link";
  link.onclick = () => copy(location.origin + location.pathname + encodeSys(s), "link copied");
  const exp = el("button", "btn"); exp.textContent = "Export";
  exp.onclick = () => { tab = "export"; renderRail(); };
  exp.disabled = !sys.colors.length;
  $("#rAct").append(link, exp);
}

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

/* The top 40% of a cell is the core target — clientY, not offsetY, because the spans are children.
   Keyboard activation reports detail 0 and clientY 0, i.e. "above the top edge", so Enter and Space
   used to land in the cap and set the core. They fall through to the accent toggle now, which is
   what the instructions have always said and the only reason a ~19px band is an acceptable target. */
const hitsCap = (e, r) => e.detail > 0 && e.clientY - r.top < r.height * 0.4;

const cellKeys = (c) => (e) => {
  const k = e.key.toLowerCase();
  if (k === "c") { e.preventDefault(); setCore(c); }
  else if (k === "x") { e.preventDefault(); toggleOut(c); }
};

function cellFor(s, c, big) {
  const role = roleOf(s, c);
  const b = el("button", `cell ${lum(c) > 0.55 ? "dk" : "lt"} ${role === "core" ? "core on" : role === "accent" ? "on" : role === "out" ? "out" : ""}${big ? " bigcell" : ""}`);
  b.style.background = c;
  b.dataset.hex = c;
  b.setAttribute("aria-label", `${c} — ${role === "open" ? "not chosen" : role}`);
  if (role === "core") b.innerHTML = `<span class="rl">core</span><span>${c.slice(1)}</span>`;
  else if (role === "accent") b.innerHTML = `<span>${c.slice(1)}</span>`;
  /* hover/focus reveals these; a chosen swatch already shows its hex, so only the rest need them */
  else b.innerHTML = `<span class="rl cue">core</span><span class="hx">${c.slice(1)}</span>`;
  b.onclick = (e) => {
    role !== "core" && hitsCap(e, b.getBoundingClientRect()) ? setCore(c) : toggleAccent(c);
  };
  b.onkeydown = cellKeys(c);
  return b;
}

/* list view: the same three verbs as a cell, but as labelled buttons — nothing lives in a hover */
function listRow(s, c) {
  const role = roleOf(s, c);
  const row = el("div", "lrow" + (role === "out" ? " out" : ""));
  const sw = el("button", "lsw" + (role === "core" || role === "accent" ? " on" : ""));
  sw.style.background = c;
  sw.dataset.hex = c;
  sw.setAttribute("aria-label", `${c} — ${role === "open" ? "not chosen" : role}`);
  sw.onclick = () => toggleAccent(c);
  sw.onkeydown = cellKeys(c);
  row.append(sw, el("code", "lhex", c.slice(1)), el("span", "lrole", role === "open" ? "" : role));
  if (role !== "core") {
    const mk = el("button", "act"); mk.textContent = "core"; mk.dataset.k = "mk" + c;
    mk.onclick = () => setCore(c);
    const ex = el("button", "act"); ex.textContent = role === "out" ? "restore" : "eliminate"; ex.dataset.k = "ex" + c;
    ex.onclick = () => toggleOut(c);
    row.append(mk, ex);
  }
  return row;
}

/* the tray: chips for the record itself. data-k (not the shared hex) is what focus restore keys on,
   so a rebuild never hands a chip's focus to the board cell wearing the same colour. */
function trayFor(s) {
  const tray = el("div", "tray");
  tray.dataset.drop = "tray";
  if (!s.core && !s.accent.length) {
    tray.append(el("span", "none", "nothing chosen yet"));
    return tray;
  }
  if (s.core) {
    const chip = el("div", "tchip corechip",
      `<i style="background:${s.core}"></i><span class="tl">core</span><code>${s.core.slice(1)}</code>`);
    chip.tabIndex = 0;
    chip.dataset.k = "t" + s.core;
    chip.setAttribute("role", "button");
    chip.setAttribute("aria-label", `core — ${s.core}. The core moves from the board: focus a swatch and press C.`);
    chip.onclick = () => flashCell(s.core);
    tray.append(chip);
  }
  orderedOf(s).forEach((c, i) => {
    const away = s.src[c];
    const chip = el("div", "tchip",
      `<i style="background:${c}"></i><span class="tl">a${i + 1}</span><code>${c.slice(1)}</code>${
        away ? `<span class="tp">p.${away}</span>` : ""}`);
    chip.dataset.hex = c;
    chip.dataset.k = "t" + c;
    chip.tabIndex = 0;
    chip.setAttribute("role", "button");
    chip.setAttribute("aria-label",
      `accent ${i + 1} — ${c}${away ? `, drawn from page ${away}` : ""}. Arrow keys reorder, X removes.`);
    const x = el("button", "tx", '<svg class="i" aria-hidden="true"><use href="#i-close"/></svg>');
    x.setAttribute("aria-label", `Remove ${c}`);
    x.tabIndex = -1; /* the chip is the tab stop; ✕ is the pointer spelling of the same act */
    x.onclick = (e) => { e.stopPropagation(); removeAccent(c); };
    chip.append(x);
    chip.onclick = () => flashCell(c);
    chip.onkeydown = (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); moveAccent(c, e.key === "ArrowLeft" ? -1 : 1); }
      else if (e.key.toLowerCase() === "x" || e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeAccent(c); }
    };
    draggable(chip, {
      label: "a" + (i + 1), color: c,
      canDrop: (t) => {
        const d = t?.dataset.drop;
        if (d === "tray") return { ok: true, text: "reorder" };
        if (d?.startsWith("role:")) return { ok: false, text: "roles read the neutral ramp" };
        return { ok: true, text: "release to remove" };
      },
      onDrop: (t, ev) => {
        const d = t?.dataset.drop;
        if (d === "tray") reorderTo(c, ev.clientX, ev.clientY);
        else if (d?.startsWith("role:")) { shake(t); toast("roles read the neutral ramp — pp. 4–5"); }
        else removeAccent(c);
      },
    });
    tray.append(chip);
  });
  return tray;
}

/* the ramp, liftable: the same eleven steps the ladder reads, as drag sources for the rows below
   and the page beside. Pointer-only sugar — the ladder's own buttons stay the keyboard path. */
function rampStrip(s) {
  const n = neutralOf(s);
  const wrap = el("div");
  const strip = el("div", "rstrip");
  strip.setAttribute("aria-hidden", "true");
  n.colors.forEach((c, j) => {
    const step = el("div", `rstep ${lum(c) > 0.55 ? "dk" : "lt"}`);
    step.style.background = c;
    step.title = `neutral-${j + 1}`;
    draggable(step, {
      label: `neutral-${j + 1}`, color: c,
      canDrop: (t) => {
        const role = roleFrom(t);
        if (!role) return null;
        const [other, phrase, isText] = PAIR[role];
        const r = ratio(n.colors[j], n.colors[readStep(open, other)]);
        return { ok: !isText || r >= 4.5, text: `${role} · ${phrase} ${fmt(r)}:1${isText ? " " + grade(r) : ""}` };
      },
      onDrop: (t) => { const role = roleFrom(t); if (role) dropRole(role, j); },
    });
    strip.append(step);
  });
  wrap.append(strip, el("p", "stripcue", "drag a step onto a role below, or onto the preview itself"));
  return wrap;
}

/* the text pairings currently below AA — what decides whether the ladder is worth opening */
function failing(s) {
  const n = NEUTRALS.find((x) => x.name === s.neutral);
  if (!n) return [];
  return ROLES.filter((role) => {
    const [other, , isText] = PAIR[role];
    return isText && ratio(n.colors[readStep(s, role)], n.colors[readStep(s, other)]) < 4.5;
  });
}

/* the ladder: five roles, eleven steps each, the live ratio, and a ghost mark on the nearest step
   that clears AA. A failing pairing used to be a dead end in a string; here the fix is one click. */
function ladder(s) {
  const n = neutralOf(s);
  const wrap = el("div", "lad");
  if (!n) return wrap;
  ROLES.forEach((role) => {
    const [other, phrase, isText] = PAIR[role];
    const mine = n.colors[readStep(s, role)], theirs = n.colors[readStep(s, other)];
    const r = ratio(mine, theirs);
    const bad = isText && r < 4.5;

    const name = el("span", `rn${s.roles[role] != null ? " moved" : ""}`);
    name.textContent = role;
    name.dataset.drop = "role:" + role;
    if (s.roles[role] != null) {
      /* a moved role resets one at a time, not only all at once */
      const rx = el("button", "rx", '<svg class="i" aria-hidden="true"><use href="#i-close"/></svg>');
      rx.dataset.k = "rx" + role;
      rx.setAttribute("aria-label", `Reset ${role} to its default step`);
      rx.onclick = () => { flashRole = role; withUndo(`${role} reset`, () => delete open.roles[role]); };
      name.append(rx);
    }
    const steps = el("div", "steps");
    steps.dataset.drop = "role:" + role;
    /* the ramp always reads dark→light; in dark theme the marker sits at the mirrored position */
    const eff = readStep(s, role);
    /* only the text roles get the ghost mark. bg and surface report the same failing ratio, but
       moving the ground to fix a text colour is the wrong lever — and it drags border with it. */
    const fixAt = bad && role.startsWith("text") ? nearestFix(n.colors, eff, theirs) : -1;
    n.colors.forEach((c, j) => {
      const b = el("button", "step" + (j === fixAt ? " fix" : ""));
      b.style.background = c;
      b.setAttribute("aria-pressed", String(j === eff));
      b.setAttribute("aria-label", `${role} reads neutral-${j + 1} (${c})`);
      b.onclick = () => {
        const light = s.dark ? 10 - j : j;
        light === ROLE_STEP[role] ? delete s.roles[role] : (s.roles[role] = light);
        flashRole = role;
        persistSystems(); renderRail();
      };
      steps.append(b);
    });
    const read = el("p", `rd${bad ? " bad" : ""}`);
    read.textContent = `${phrase} ${fmt(r)}:1${isText ? " " + grade(r) : ""}` +
      (fixAt >= 0 ? ` — marked step clears ${fmt(ratio(n.colors[fixAt], theirs))}:1` : "");
    wrap.append(name, steps, read);
  });
  return wrap;
}
/* nearest step to `from` whose contrast against `against` reaches AA — the mark the row shows */
function nearestFix(ramp, from, against) {
  let best = -1, dist = 99;
  ramp.forEach((c, i) => {
    if (ratio(c, against) >= 4.5 && Math.abs(i - from) < dist) { dist = Math.abs(i - from); best = i; }
  });
  return best;
}

function buildExportTab(body, p, s) {
  const sys = system(p, s);
  const nav = el("nav");
  nav.append(...Object.keys(FORMATS).map((k) => {
    const b = el("button", "chip"); b.textContent = k;
    b.setAttribute("aria-pressed", k === dlgFormat);
    b.onclick = () => { dlgFormat = k; renderRail(); };
    return b;
  }));
  const pre = el("pre");
  pre.textContent = FORMATS[dlgFormat].make(sys);
  body.append(nav, pre);

  $("#rAct").innerHTML = "";
  const back = el("button", "btn ghost"); back.textContent = "Build";
  back.onclick = () => { tab = "build"; renderRail(); };
  const dl = el("button", "btn ghost"); dl.textContent = "Download";
  dl.onclick = () => download(sys, dlgFormat);
  const cp = el("button", "btn"); cp.textContent = "Copy";
  cp.onclick = () => copy(pre.textContent, dlgFormat + " copied");
  cp.disabled = dl.disabled = !sys.colors.length;
  $("#rAct").append(back, dl, cp);
}

/* ---------- preview: a page, because a colour system is judged across one ---------- */
function previewNode() {
  return el("div", "prev", `
    <div class="pnav" data-drop="role:surface"><span class="brand">Acme</span><span>Work · Studio · Journal</span><span class="pill">Contact</span></div>
    <div class="pbody" data-drop="role:bg">
      <h4 data-drop="role:text">A colour system is judged across a page, not on a single card</h4>
      <p data-drop="role:text">Body copy sits on the background in the text colour, at a length long enough to show what
         reading it actually feels like — two lines is the shortest honest test.</p>
      <div class="prow"><span class="pbtn">Primary action</span><span class="pbtn sec">Secondary</span></div>
      <div class="prow ptags"></div>
    </div>
    <div class="psec">
      <blockquote>Colour is the first thing people notice about a design, and the last thing they forget.</blockquote>
      <p class="pcap" data-drop="role:text-muted" style="margin-top:.6rem">Caption — muted text on the background.</p>
    </div>
    <div class="psec">
      <p class="plabel">Email</p>
      <div class="pfield focus" data-drop="role:surface">you@studio.com</div>
      <p class="pcap" data-drop="role:text-muted" style="font-size:.68rem">Enter an address we can reach you at.</p>
    </div>
    <div class="pfoot" data-drop="role:surface"><span>© 2026 Acme</span><span>Privacy · Terms</span></div>`);
}

/* repaints a preview node only — never touches the export pane, so the rail's own re-render can't flicker it */
function paintPreview(node, p, s) {
  if (!node || !s.core || !neutralOf(s)) return;
  const r = system(p, s).roles;
  node.style.cssText = [
    `--p-bg:${r.bg}`, `--p-surface:${r.surface}`, `--p-line:${r.border}`,
    `--p-ink:${r.text}`, `--p-mut:${r["text-muted"]}`,
    `--p-core:${s.core}`, `--p-core-ink:${r["core-ink"]}`,
  ].join(";");
  /* every accent, not just accent-1 — picking six and seeing one is how you ship a system you never saw */
  const acc = orderedOf(s);
  const tags = node.querySelector(".ptags");
  if (tags) tags.innerHTML = acc
    .map((c, i) => `<span class="tag" style="background:${c};color:${ink(c)}">accent ${i + 1}</span>`).join("");
  warnChips(node, s);
}

/* ---- persistent verdicts, build state only: a text pairing below AA stays announced on the
   page being judged for as long as it is true — the toast is just the event receipt. Browsing
   never sees these; they exist only where a built system is previewed. ---- */
const PAIRINGS = [["text", "bg", "text on bg"], ["text-muted", "surface", "muted on surface"]];
function warnChips(node, s) {
  const n = neutralOf(s);
  PAIRINGS.forEach(([ink2, ground, phrase]) => {
    const r = ratio(n.colors[readStep(s, ink2)], n.colors[readStep(s, ground)]);
    if (r >= 4.5) return;
    /* pin to the region that reads the failing ink; fall back to its ground, then the page */
    const anchor = node.querySelector(`[data-drop="role:${ink2}"]`) ||
      node.querySelector(`[data-drop="role:${ground}"]`) || node;
    if (!anchor.style.position) anchor.style.position = "relative";
    const idx = anchor.querySelectorAll(".pwarn").length;
    const chip = el("button", "pwarn", `⚠ ${phrase} ${fmt(r)}:1`);
    if (idx) chip.style.top = `calc(.3rem + ${idx * 1.7}rem)`;
    chip.title = `${phrase} reads ${fmt(r)}:1 — AA needs 4.5:1. Open the role ladder.`;
    chip.setAttribute("aria-label", chip.title);
    chip.onclick = (e) => {
      e.stopPropagation();
      const d = $("#rBody")?.querySelector("details.roles");
      if (!d) return; /* compare tray has no ladder — the chip is a verdict there, not a door */
      d.open = true;
      const t = d.querySelector(`.rn[data-drop="role:${ink2}"]`);
      t?.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    };
    anchor.append(chip);
  });
}

function paletteNode() {
  return el("div", "pal", `
    <div class="pf-field"></div>

const swatch = (cls, hex, label, grow) => {
  const b = el("div", `pf-sw ${lum(hex) > 0.55 ? "dk" : "lt"} ${cls || ""}`,
    `<span class="rl">${label}</span><span>${hex.slice(1)}</span>`);
  if (grow) b.style.flexGrow = grow;
  b.style.background = hex;
  return b;
};

function paintPalette(node, p, s) {
  if (!node || !s.core || !neutralOf(s)) return;
  const sys = system(p, s);
  const acc = orderedOf(s);

  const field = node.querySelector(".pf-field");
  field.innerHTML = "";
  field.append(swatch("field", sys.roles.bg, "bg · " + sys.steps.bg, 1));

  const row = node.querySelector(".pf-row");
  row.innerHTML = "";
  row.append(swatch("core", s.core, "core", 2));
  acc.forEach((c, i) => row.append(swatch("", c, "accent-" + (i + 1), 1)));

  const ramp = node.querySelector(".pf-ramp");
  ramp.innerHTML = "";
  neutralOf(s).colors.forEach((c, i) => ramp.append(swatch("", c, "neutral-" + (i + 1), 1)));
}

function chartNode(p, s) {
  const acc = orderedOf(s);
  const series = acc.length ? acc.slice(0, 4) : [s.core];
  /* fixed data, deterministic render — the chart is a colour instrument, not a dashboard */
  const groups = [[62, 38, 74, 51], [48, 80, 30, 66], [71, 52, 58, 40]];
  const W = 320, H = 132, top = 8, bottom = 18, left = 10, right = 10;
  const plotH = H - top - bottom, gw = (W - left - right) / groups.length;
  let bars = "";
  groups.forEach((g, gi) => {
    const bw = Math.min(16, (gw - 26) / series.length);
    series.forEach((c, si) => {
      const h = plotH * (g[si % g.length] / 100);
      const x = left + gi * gw + (gw - bw * series.length - 2 * (series.length - 1)) / 2 + si * (bw + 2);
      bars += `<rect x="${x.toFixed(1)}" y="${(top + plotH - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${c}"/>`;
    });
  });
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const y = (top + plotH * (1 - f)).toFixed(1);
    return `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}"/>`;
  }).join("");
  const labels = ["Q1", "Q2", "Q3"].map((q, i) =>
    `<text x="${(left + i * gw + gw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${q}</text>`).join("");
  return el("div", "prev", `

          `<span><i style="background:${c}"></i>${acc.length ? "accent-" + (i + 1) : "core"}</span>`).join("")}</div>
      </div>
    </div>`);
}

  $("#cmpTitle").textContent = `Compare — ${list.map((s) => s.name).join(" · ")}`;
  const body = $("#cmpBody");

  list.forEach((s) => {
    const p = byPage.get(s.page);

    /* sources() carries s.neutral, which is user text too — both go through esc() */
    const head = el("div", "cmpname", `<b>${esc(s.name)}</b><span>${esc(sources(s))} · ${s.dark ? "dark" : "light"}</span>`);
    col.append(head);

$("#cmpClose").onclick = () => document.body.classList.remove("cmp");
/* one flip for the whole tray — "is this system calmer" is a different question in each theme */
$("#cmpTheme").onclick = () => {
  systems.filter((s) => pinned.has(s.id)).forEach((s) => (s.dark = !s.dark));

};
/* Escape unwinds one layer at a time, innermost first. The rail is a full screen now, so it has to be
   on this list — a fullscreen surface whose only exit is one ✕ in a corner is a trap. <dialog> does
   its own Escape, and without this guard closing it would take the rail down behind it. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("#dlg").open || $("#delDlg").open) return;
  if (drag) drag.cancel();
  else if (document.body.classList.contains("cmp")) document.body.classList.remove("cmp");
  else if (drawFrom) { drawFrom = null; render(); }
  else if (picking) { picking = false; render(); }
  else if (open) { open = null; render(); }
});

/* The book's order opens on its five Neutrals scales — five grey ramps before any colour, every load.
   Shuffled here and nowhere earlier: the section chips (sections) and the builder's ramp list (NEUTRALS)
   are both captured above, in book order, and byPage looks up by page rather than position.
   Fisher–Yates, not sort(() => Math.random() - .5) — a comparator shuffle leaves items near where they
   started, which is the exact thing being fixed. */
for (let i = PALETTES.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [PALETTES[i], PALETTES[j]] = [PALETTES[j], PALETTES[i]];
}

render();

{ /* a shared link applies once, then leaves the URL clean so a reload doesn't re-apply it */
  const d = decodeSys(location.hash);
  if (d && byPage.has(+d.page)) {
    history.replaceState(null, "", location.pathname + location.search);
    d.page = +d.page;
    const p = byPage.get(d.page);
    /* colors.js can be regenerated under a shared link — drop hexes the palettes no longer have */
    const known = (c) => p.colors.includes(c) || d.src[c];
    d.accent = d.accent.filter(known);
    d.out = d.out.filter((c) => p.colors.includes(c));
    if (!p.colors.includes(d.core)) d.core = null;
    systems.push(d);
    persistSystems();
    open = d; tab = "build";
    render();
  }
}

console.assert(new Set(PALETTES.map((p) => p.page)).size === PALETTES.length, "shuffle lost or duplicated a palette");

{

  console.assert(r.cols[r.cols.length - 1].fam === "neutral", "neutral column should sort last", r.cols.map((c) => c.fam));

    .forEach((h) => {

    });
  /* a system naming a scale that no longer exists must stay openable and repairable, not crash the rail */
  const ghost = Object.assign(blank(72, "Ghost"), { core: "#FF7500", neutral: "Nope" });
  console.assert(neutralOf(ghost) === null && system(p, ghost).roles.bg === undefined, "ghost neutral not resolved to null");
  console.assert((() => { try { ladder(ghost); failing(ghost); return true; } catch { return false; } })(),
    "ladder/failing must survive a scale colors.js no longer prints");

  /* real WCAG ratios, not the perceptual lum() — these numbers get quoted in a room */
  console.assert(ratio("#FFFFFF", "#000000").toFixed(0) === "21" && ratio("#FFFFFF", "#FFFFFF") === 1, "contrast ratio broken");
  console.assert(contrast("#767676", "#FFFFFF") === "4.5:1 AA" && contrast("#909090", "#FFFFFF").endsWith("large text only"),
    "WCAG grading broken", [contrast("#767676", "#FFFFFF"), contrast("#909090", "#FFFFFF")]);

  /* v1 localStorage migrates to named records rather than being dropped. Call the real migrate() —
     asserting on a re-implementation of it here let the field whitelist regress unnoticed. */
  const mig = migrate({ 72: { core: "#FF7500", accent: ["#00C45B"], neutral: "Stone", dark: true },
    33: { core: null, accent: [] }, 99: null, 7: { core: "#0C0A09", id: "STOLEN", out: ["#x"] } });
  const m72 = mig.find((r) => r.page === 72), m7 = mig.find((r) => r.page === 7);
  console.assert(mig.length === 2 && m72.name === "Bold 23" && m72.out.length === 0 && m72.id,
    "v1 migration should name the record after its palette and skip empty entries", mig);
  console.assert(m7.id !== "STOLEN" && m7.out.length === 0,
    "migration must whitelist fields, not copy the v1 blob wholesale", m7);
  console.assert(localStorage.getItem("colorbook-builds") === null || true, "v1 key is read, never cleared");
  /* one corrupt key must not take the page with it — localStorage is the only store there is */
  localStorage.setItem("colorbook-probe", "{oops");
  console.assert(load("colorbook-probe", "[]").length === 0, "load() should fall back on corrupt JSON");
  localStorage.removeItem("colorbook-probe");

  /* keyboard activation reports detail 0 and clientY 0 — Enter/Space must NOT land in the core cap */
  const cell = { top: 400, height: 40 };
  console.assert(!hitsCap({ detail: 0, clientY: 0 }, cell), "Enter/Space sets the core instead of toggling an accent");
  console.assert(hitsCap({ detail: 1, clientY: 405 }, cell) && !hitsCap({ detail: 1, clientY: 430 }, cell),
    "the mouse cap region moved");

  /* one ink per accent: a light and a dark accent cannot share a label colour */
  const two = Object.assign(structuredClone(s), { accent: ["#DCF3FA", "#476BFF"] });
  const ts = system(p, two), ta = ordered(two);
  console.assert(ts.roles["accent-ink"] === undefined, "the single --accent-ink token is gone");
  ta.forEach((c, i) => console.assert(ts.roles[`accent-${i + 1}-ink`] === ink(c),
    `accent-${i + 1}-ink must be that accent's own ink`, [c, ts.roles[`accent-${i + 1}-ink`]]));
  console.assert(new Set(ta.map(ink)).size === 2 && ts.roles["accent-1-ink"] !== ts.roles["accent-2-ink"],
    "this pair is the whole point — it needs two different inks", ta.map(ink));

  /* the tally is arithmetic about THIS page; accents from elsewhere are counted apart, not added in */
  const away = Object.assign(structuredClone(s), { accent: [...s.accent, "#AB12CD"], src: { "#AB12CD": 227 } });
  console.assert(system(p, away).tally === "3 of 27 chosen · 0 eliminated · 1 from other pages",
    "tally counted a colour p.72 does not print", system(p, away).tally);
  console.assert(system(p, s).tally === "3 of 27 chosen · 0 eliminated", "tally grew a clause it should not have");

  /* the core is never also an accent, whichever page lends it */
  const dup = Object.assign(blank(72, "Dup"), { core: "#FF7500" });
  const prevOpen = open; open = dup; drawAccent("#FF7500", 227); open = prevOpen;
  console.assert(dup.accent.length === 0, "drawAccent let the core in as accent-1 too", dup.accent);

  /* a displayed ratio must never contradict its own grade */
  console.assert(fmt(6.995) === "6.9" && fmt(2.9541) === "2.9" && fmt(7.001) === "7.0",
    "fmt must round down across the AA/AAA thresholds", [fmt(6.995), fmt(2.9541)]);

  /* The regression that made draw-from unreachable: the button only renders while a system is open,
     and opening one hid the grid it renders in. Assert the two states, not the one. */
  {
    const g = $("#grid"), was = document.body.className;
    document.body.className = "rail";
    console.assert(getComputedStyle(g).display === "none", "the grid should step out while building");
    document.body.className = "rail pick";
    console.assert(getComputedStyle(g).display !== "none",
      "picking must bring the grid back, or the draw-from button has nowhere to render");
    document.body.className = was;
  }

  /* the rail is a full screen with one ✕ in a corner — Escape has to be able to close it */
  {
    const wasOpen = open, wasPick = picking;
    open = Object.assign(blank(72, "Esc probe"), { core: "#FF7500" }); picking = true;
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    console.assert(!picking && open, "Escape should leave picking first, not close the system under it");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" }));
    console.assert(open === null, "Escape must close the rail", open);
    open = wasOpen; picking = wasPick; render();
  }

  /* a name is user text and reaches innerHTML in three places — it must never arrive as markup */
  console.assert(esc('<img src=x onerror="alert(1)">') === "&lt;img src=x onerror=&quot;alert(1)&quot;&gt;",
    "esc() must neutralise tags and attribute quotes", esc("<img>"));
  const eek = decodeSys(encodeSys(Object.assign(blank(72, '<img src=x onerror="alert(1)">'), { core: "#FF7500" })));
  console.assert(eek.name.includes("<") && !esc(eek.name).includes("<"),
    "a hostile name survives decode (that is fine) but must not survive esc()", eek.name);

  /* a step is one of eleven. 99 read n.colors[99] → undefined → the contrast math sliced undefined
     and every render path died, from a link anyone could hand-edit. */
  const wild = decodeSys("#b2=" + b64(JSON.stringify([72, "W", "#FF7500", ["#00C45B"], "Stone", 0,
    { bg: 99, "text-muted": -1, nope: 3, border: 1.5 }, [], {}])));
  console.assert(Object.keys(wild.roles).length === 0,
    "out-of-range, fractional and unknown role steps must all be dropped", wild.roles);
  console.assert((() => { try { system(byPage.get(72), wild); return true; } catch { return false; } })(),
    "a clamped record must render");

  /* the same hash fields, wrong types: the apply block calls .filter on accent and out */
  const typed = decodeSys("#b2=" + b64(JSON.stringify([72, { n: 1 }, 5, "nope", 7, 0, "nope", 3, "nope"])));
  console.assert(Array.isArray(typed.accent) && Array.isArray(typed.out) && typed.core === null &&
    typed.neutral === null && typed.name === "Bold 23" && typed.src && typed.roles,
    "wrong-typed hash fields must coerce, not crash the apply block", typed);
  console.assert(decodeSys("#b=72,ZZZZZZ,Stone").core === null, "a non-hex v1 core must not become #ZZZZZZ");

  /* valid JSON of the wrong type is still corrupt — it used to throw before any of this ran */
  localStorage.setItem("colorbook-probe", "3");
  console.assert(arr(load("colorbook-probe", "[]")).length === 0 && Object.keys(obj(load("colorbook-probe", "{}"))).length === 0,
    "arr()/obj() should reject valid JSON of the wrong shape");
  console.assert((() => { try { return migrate(null).length === 0 && migrate(7).length === 0; } catch { return false; } })(),
    "migrate() must survive a colorbook-builds key holding null");
  console.assert(migrate({ 72: { core: "#FF7500", accent: "not-an-array" } })[0].accent.length === 0,
    "migrate() must not hand a string to code that calls .filter on it");
  localStorage.removeItem("colorbook-probe");

  /* the export header is a comment: a name cannot be allowed to close it or start a new line of code */
  const nasty = system(byPage.get(72), Object.assign(blank(72, "Bad */ :root{color:red} /*\nline two"),
    { core: "#FF7500", neutral: "Stone" }));
  const css = FORMATS.css.make(nasty);
  console.assert(!css.includes("*/ :root") && css.split("\n")[0].endsWith("*/"),
    "a name must not break out of the CSS header comment", css.split("\n").slice(0, 2));
  console.assert(FORMATS.scss.make(nasty).split("\n")[0].startsWith("// ") &&
    FORMATS.scss.make(nasty).split("\n")[1].startsWith("// "),
    "a newline in a name must not drop the rest of a // comment into live scss");
  console.assert(cmt("a*/b") === "a* /b" && cmt("a\n b") === "a b", "cmt()", [cmt("a*/b"), cmt("a\n b")]);
}
{ /* the redesigned build screen: dragged order, tray mutations, undo, templates, board views */
  const p = byPage.get(72);
  const fx = Object.assign(blank(72, "T"), { core: "#FF7500", accent: ["#FFE4AB", "#00C45B"], neutral: "Stone" });

  /* an untouched build derives its order — and its export is frozen, byte for byte */
  console.assert(orderedOf(fx).join() === ordered(fx).join(), "no-order build must derive its order");
  const FROZEN_CSS = `/* T · Bold 23 p. 72 + Stone p. 7 · light theme */
/* 3 of 27 chosen · 0 eliminated */
/* text on bg 16.7:1 AAA · muted on surface 7.0:1 AAA · ink on core 7.3:1 AAA */
/* roles read bg=neutral-11 surface=neutral-10 border=neutral-9 text-muted=neutral-5 text=neutral-2 */
/* core — key brand moments, used with discipline */
/* accent — sparingly, for emphasis */
/* neutral — structure, backgrounds and body copy */
:root {
  --core: #FF7500;
  --accent-1: #FFE4AB;
  --accent-2: #00C45B;
  --neutral-1: #0C0A09;
  --neutral-2: #1C1917;
  --neutral-3: #292524;
  --neutral-4: #44403B;
  --neutral-5: #57534D;
  --neutral-6: #79716B;
  --neutral-7: #A6A09B;
  --neutral-8: #D6D3D1;
  --neutral-9: #E7E5E4;
  --neutral-10: #F5F5F4;
  --neutral-11: #FAFAF9;
  --bg: #FAFAF9;
  --surface: #F5F5F4;
  --border: #E7E5E4;
  --text-muted: #57534D;
  --text: #1C1917;
  --core-ink: #0A0A0A;
  --accent-1-ink: #0A0A0A;
  --accent-2-ink: #FFFFFF;
}`;
  console.assert(FORMATS.css.make(system(p, fx)) === FROZEN_CSS, "the export drifted from the frozen baseline");

  /* a dragged order reaches the export, survives the hash, and heals around stale entries */
  const of = Object.assign(structuredClone(fx), { order: ["#00C45B", "#FFE4AB"] });
  console.assert(system(p, of).colors[1] === "#00C45B" && system(p, of).names[1] === "accent-1",
    "a dragged order must reach the export", system(p, of).colors.slice(0, 3));
  console.assert(system(p, of).roles["accent-1-ink"] === ink("#00C45B"), "accent inks must follow the dragged order");
  console.assert(orderedOf(Object.assign(structuredClone(fx), { order: ["#123456", "#00C45B"] })).join() === "#00C45B,#FFE4AB",
    "stale order entries must heal, not linger");
  console.assert(decodeSys(encodeSys(of)).order.join() === "#00C45B,#FFE4AB", "the dragged order was lost in the hash");
  console.assert(decodeSys(encodeSys(fx)).order === null, "a derived-order build must stay order-null through the hash");
  console.assert(FORMATS.css.make(system(p, decodeSys(encodeSys(of)))) === FORMATS.css.make(system(p, of)),
    "an ordered link must reproduce the ordered export byte for byte");
  console.assert(decodeSys("#b2=" + b64(JSON.stringify([72, "T", "#FF7500", [], "Stone", 0, {}, [], {}, "nope"]))).order === null,
    "a wrong-typed order in a hash must coerce to null");
  /* a 9-element #b2= minted before order existed — the literal, not a re-encode */
  const LEG = "#b2=WzcyLCJUIiwiI0ZGNzUwMCIsWyIjRkZFNEFCIiwiIzAwQzQ1QiJdLCJTdG9uZSIsMCx7fSxbXSx7fV0";
  const leg = decodeSys(LEG);
  console.assert(leg && leg.core === "#FF7500" && leg.accent.join() === "#FFE4AB,#00C45B" &&
    leg.neutral === "Stone" && leg.order === null, "a pre-order #b2= link must still decode", leg);
  console.assert(FORMATS.css.make(system(p, leg)) === FROZEN_CSS, "a pre-order link must reproduce the frozen export");

  /* tray mutations + the undo toast */
  const probe = Object.assign(blank(72, "U"), { core: "#FF7500", accent: ["#FFE4AB", "#00C45B"] });
  systems.push(probe);
  const prevOpen = open, prevTab = tab;
  open = probe; tab = "build";
  withUndo("probe", () => { open.accent = ["#FFE4AB"]; });
  console.assert(sysById(probe.id).accent.length === 1, "withUndo must apply the mutation");
  $("#toast .tundo")?.click();
  console.assert(sysById(probe.id).accent.length === 2, "undo must restore the snapshot", sysById(probe.id).accent);
  open = sysById(probe.id);
  removeAccent("#00C45B");
  console.assert(open.accent.join() === "#FFE4AB" && !("#00C45B" in open.src), "removeAccent must clear accent and src");
  $("#toast .tundo")?.click();
  open = sysById(probe.id);
  console.assert(open.accent.length === 2, "removeAccent must be undoable");
  moveAccent("#00C45B", -1);
  console.assert(Array.isArray(open.order) && orderedOf(open).join() === "#00C45B,#FFE4AB", "moveAccent must record the order");
  moveAccent("#00C45B", 1);
  console.assert(open.order === null, "moving back into the derived order must dissolve the override", open.order);
  /* a role drop is a ladder click with a name: light theme writes the index, dark writes its mirror */
  open.neutral = "Stone";
  dropRole("text-muted", 3);
  console.assert(open.roles["text-muted"] === 3, "a light-theme drop must write the displayed index");
  $("#toast .tundo")?.click();
  open = sysById(probe.id);
  console.assert(open.roles["text-muted"] === undefined, "a role drop must be undoable");
  open.neutral = "Stone"; open.dark = true;
  dropRole("text-muted", 3);
  console.assert(open.roles["text-muted"] === 7, "a dark-theme drop must write the mirrored index", open.roles);
  /* the tray lists a borrowed accent the board can't show, with its page on it */
  Object.assign(open, { dark: false, roles: {}, accent: ["#FFE4AB", "#FD6CFB"], src: { "#FD6CFB": 33 } });
  render();
  console.assert($('#rBody .tray .tchip[data-hex="#FD6CFB"] .tp')?.textContent === "p.33",
    "a borrowed accent must sit in the tray naming its page");
  console.assert($('#rBody .tray .tchip[data-hex="#FD6CFB"] .tx'), "every accent chip must carry its one-gesture remove");
  systems = systems.filter((x) => x.id !== probe.id);
  open = prevOpen; tab = prevTab;
  persistSystems(); render();

  /* every preview template renders from the same system, and the page keeps its drop regions */
  Object.entries(TEMPLATES).forEach(([k, tpl]) => {
    let n = null;
    try { n = tpl.make(p, fx); } catch {}
    console.assert(n instanceof Element && n.innerHTML.length > 50, `template ${k} failed to render`);
  });
  console.assert(TEMPLATES.chart.make(p, fx).querySelectorAll("rect").length === 6, "chart must draw one bar per accent per group");
  console.assert(TEMPLATES.page.make(p, fx).querySelectorAll('[data-drop^="role:"]').length >= 4, "page template lost its drop regions");

  /* board views: list rows carry the same three verbs as cells; view prefs fall back when corrupt */
  const row = listRow(fx, "#00C45B");
  console.assert(row.querySelector(".lsw") && [...row.querySelectorAll(".act")].map((b) => b.textContent).join() === "core,eliminate",
    "a list row must offer toggle, core and eliminate");
  console.assert(listRow(fx, "#FF7500").querySelectorAll(".act").length === 0, "the core row has nothing to do but be core");
  const wasBoard = ui.board, wasTpl = ui.tpl;
  ui.board = "bogus"; ui.tpl = "bogus";
  console.assert(boardView() === "ramps" && previewTpl() === "page", "unknown view prefs must fall back");
  ui.board = wasBoard; ui.tpl = wasTpl;
}
{ /* the persistent verdict chip: build-state only, standing exactly as long as the failure does */
  const p = byPage.get(72);
  /* dark theme + text-muted moved to mirrored step 7 = the 1.7:1 pairing the old toast reported */
  const bad = Object.assign(blank(72, "W"), { core: "#FF7500", neutral: "Stone", dark: true, roles: { "text-muted": 7 } });
  const n1 = TEMPLATES.page.make(p, bad);
  console.assert(n1.querySelectorAll(".pwarn").length === 1 && n1.querySelector(".pwarn").textContent.includes("muted on surface"),
    "a failing text pairing must pin a persistent chip on the preview", n1.querySelector(".pwarn")?.textContent);
  const good = Object.assign(blank(72, "G"), { core: "#FF7500", neutral: "Stone" });
  console.assert(TEMPLATES.page.make(p, good).querySelectorAll(".pwarn").length === 0,
    "a passing build must show no warning chips");
  console.assert(TEMPLATES.cards.make(p, bad).querySelectorAll(".pwarn").length === 1,
    "a template without a muted region must still anchor the chip somewhere");
  console.assert(TEMPLATES.palette.make(p, bad).querySelectorAll(".pwarn").length === 0,
    "the palette sheet shows colours, not judgements — no chips there");
}
/* the self-checks above drive the real toast pipeline — a fresh load must not greet her with a
   test's receipt. State cleanup, not a behaviour change: real toasts still show and fade. */
clearTimeout(toastTimer);
$("#toast").classList.remove("show");
$("#toast").textContent = "";
</script>
</body>
