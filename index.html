<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colourbook — palette library</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%228%22 height=%228%22 fill=%22%23C8451F%22/><rect x=%228%22 width=%228%22 height=%228%22 fill=%22%23F2C230%22/><rect y=%228%22 width=%228%22 height=%228%22 fill=%22%233767C8%22/><rect x=%228%22 y=%228%22 width=%228%22 height=%228%22 fill=%22%231D1A16%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAFA;
    --card: #FFFFFF;
    --ink: #0A0A0A;
    --line: #E4E4E4;
    --mut: #8A8A8A;
    --accent: #0A0A0A;
    --sans: "Geist", "Helvetica Neue", sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  header.masthead { padding: clamp(3.5rem, 9vw, 7rem) clamp(1.5rem, 5vw, 5rem) 2.5rem; }
  .masthead h1 {
    font-size: clamp(3.2rem, 11vw, 9.5rem);
    font-weight: 600;
    letter-spacing: -.045em;
    line-height: .9;
  }
  .masthead h1 em { font-style: normal; font-weight: 300; }
  .masthead .meta {
    margin-top: 3rem; padding-top: .7rem; border-top: 1px solid var(--ink);
    font-family: var(--sans); font-weight: 500; font-size: .625rem; letter-spacing: .22em; text-transform: uppercase;
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--paper) 94%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: .95rem clamp(1.5rem, 5vw, 5rem);
    display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.75rem;
  }
  .toolbar input {
    font-family: var(--mono); font-size: .75rem; color: var(--ink);
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    padding: .35rem 0; width: 14rem; outline: none;
  }
  .toolbar input:focus { border-bottom-color: var(--accent); }
  .toolbar input::placeholder { color: var(--mut); }
  #sections { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; }
  .chip {
    font-family: var(--sans); font-weight: 500; font-size: .625rem; letter-spacing: .18em; text-transform: uppercase;
    background: none; border: none; padding: .25rem 0; cursor: pointer; color: var(--mut);
    text-underline-offset: 5px; text-decoration-thickness: 1px;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--accent); text-decoration: underline; }
  .dots { display: flex; gap: .55rem; align-items: center; }
  .dot {
    width: .8rem; height: .8rem; border-radius: 50%; border: 1px solid rgba(0,0,0,.2);
    cursor: pointer; padding: 0; transition: scale .15s;
  }
  .dot:hover { scale: 1.2; }
  .dot[aria-pressed="true"] { outline: 1px solid var(--accent); outline-offset: 3px; }
  .spacer { flex: 1; }

  main {
    padding: 2.5rem clamp(1.5rem, 5vw, 5rem) 6rem;
    display: grid; gap: 2rem;
    grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    display: flex; flex-direction: column;
    animation: rise .6s cubic-bezier(.2,.6,.2,1) backwards;
    transition: border-color .3s;
  }
  .card:hover { border-color: var(--ink); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  .bands { display: flex; height: 10rem; }
  .band {
    flex: 1 1 0; min-width: 0; border: none; cursor: copy; padding: .4rem .3rem;
    display: flex; align-items: flex-start; justify-content: center;
    transition: flex-grow .28s;
  }
  .band span {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .03em;
    opacity: 0; transition: opacity .2s; white-space: nowrap;
  }
  .band:hover, .band:focus-visible { flex-grow: 3; }
  .band:hover span, .band:focus-visible span { opacity: 1; }
  .bands.many .band span { writing-mode: vertical-rl; }
  .band.lt span { color: rgba(255,255,255,.95); }
  .band.dk span { color: rgba(0,0,0,.8); }

  .card footer { padding: .9rem 1rem 1rem; border-top: 1px solid var(--line); }
  .card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .card h3 { font-size: 1rem; font-weight: 500; letter-spacing: -.01em; }
  .card .page { font-family: var(--sans); font-size: .6rem; letter-spacing: .14em; color: var(--mut); }
  .card .row2 { margin-top: .6rem; display: flex; justify-content: space-between; align-items: center; }
  .card .sec {
    font-family: var(--sans); font-weight: 500; font-size: .575rem; letter-spacing: .2em;
    text-transform: uppercase; color: var(--mut);
  }
  .acts { display: flex; flex-wrap: wrap; gap: .5rem .9rem; }
  .acts button {
    font-family: var(--sans); font-weight: 500; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: none; padding: 0; cursor: pointer; color: var(--ink);
    text-underline-offset: 4px; text-decoration-thickness: 1px;
  }
  .acts button:hover { text-decoration: underline; }
  .acts .save[aria-pressed="true"] { color: var(--accent); text-decoration: underline; }

  .empty { grid-column: 1 / -1; text-align: center; padding: 6rem 1rem; color: var(--mut); font-size: 1.1rem; }

  .colophon {
    border-top: 1px solid var(--line); margin: 0 clamp(1.5rem, 5vw, 5rem); padding: 1.2rem 0 3.5rem;
    font-family: var(--sans); font-weight: 500; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mut);
  }

  dialog {
    margin: auto; /* the * reset above removes the UA centering */
    background: var(--card); color: var(--ink); border: 1px solid var(--ink);
    padding: 0; width: min(34rem, calc(100vw - 2rem));
    max-height: 92svh; overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem .75rem; }
  dialog h3 { font-weight: 500; font-size: 1.15rem; letter-spacing: -.01em; }
  dialog header button { background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--mut); }
  dialog nav { display: flex; gap: .2rem 1.1rem; padding: 0 1.5rem .9rem; flex-wrap: wrap; }
  dialog pre {
    margin: 0 1.5rem; padding: 1rem; background: var(--paper); border: 1px solid var(--line);
    font-family: var(--mono); font-size: .72rem; line-height: 1.6;
    max-height: 40vh; overflow: auto;
  }
  dialog footer { display: flex; gap: .75rem; justify-content: flex-end; padding: 1.25rem 1.5rem 1.5rem; }
  dialog footer button {
    font-family: var(--sans); font-weight: 500; font-size: .625rem; letter-spacing: .16em; text-transform: uppercase;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: .6rem 1.4rem; cursor: pointer;
  }
  dialog footer button.ghost { background: transparent; color: var(--ink); }
  dialog footer button:disabled { opacity: .35; cursor: not-allowed; }

  /* ---------- builder (PDF pp. 4–5: core + accent + neutral, eliminate the rest) ---------- */
  #builder { display: none; padding: 0 1.5rem .5rem; }
  #dlg.build #builder { display: block; }
  .blab {
    font-weight: 500; font-size: .575rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--mut); margin: 1.1rem 0 .45rem;
  }
  .blab span { text-transform: none; letter-spacing: .04em; font-family: var(--mono); margin-left: .5rem; }

  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(2.5rem, 1fr)); gap: 1px; }
  .pick {
    height: 3rem; border: none; padding: 0; cursor: pointer;
    opacity: .22; transition: opacity .18s;
    display: flex; align-items: center; justify-content: center;
  }
  .pick.on, .pick:hover { opacity: 1; }
  .pick span { font-family: var(--mono); font-size: .55rem; letter-spacing: .06em; }
  .pick.lt span { color: rgba(255,255,255,.95); }
  .pick.dk span { color: rgba(0,0,0,.8); }

  .neuts { display: flex; flex-direction: column; gap: 1px; }
  /* outline, not border: a border shifts the gradient's origin box and tiles a dark sliver at the right edge */
  .neut { border: none; height: 1.5rem; cursor: pointer; padding: 0; position: relative; }
  .neut[aria-pressed="true"] { outline: 1px solid var(--ink); outline-offset: -1px; }
  .neut b {
    position: absolute; left: .45rem; top: 50%; translate: 0 -50%;
    font-family: var(--sans); font-weight: 500; font-size: .55rem; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(255,255,255,.9);
  }

  .prev { border: 1px solid var(--line); padding: 1.1rem 1.2rem; background: var(--p-bg); color: var(--p-ink); }
  .prev h4 { font-size: 1.15rem; font-weight: 500; letter-spacing: -.015em; }
  .prev p { font-size: .8rem; line-height: 1.55; color: var(--p-mut); margin: .4rem 0 .9rem; }
  .prow { display: flex; align-items: center; gap: .75rem; border-top: 1px solid var(--p-line); padding-top: .9rem; }
  .prev button {
    font-family: var(--sans); font-weight: 500; font-size: .625rem; letter-spacing: .16em; text-transform: uppercase;
    background: var(--p-core); color: var(--p-core-ink); border: none; padding: .6rem 1.3rem; cursor: default;
  }
  .prev .tag {
    font-family: var(--mono); font-size: .6rem; background: var(--p-acc); color: var(--p-acc-ink); padding: .3rem .6rem;
  }

  #toast {
    position: fixed; left: 50%; bottom: 1.75rem; translate: -50% 0; z-index: 50;
    background: var(--ink); color: var(--paper); font-family: var(--sans); font-weight: 500; font-size: .625rem;
    letter-spacing: .14em; text-transform: uppercase; padding: .6rem 1.2rem;
    opacity: 0; pointer-events: none; transition: opacity .25s, translate .25s;
  }
  #toast.show { opacity: 1; translate: -50% -4px; }
</style>
</head>
<body>

<header class="masthead">
  <h1>COLOUR<em>BOOK</em></h1>
  <div class="meta"><span id="meta">—</span><span>V1.0 — 2026</span></div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="Search name, section, hex…" aria-label="Search palettes">
  <div id="sections"></div>
  <div class="dots" id="dots" role="group" aria-label="Filter by hue"></div>
  <span class="spacer"></span>
  <button class="chip saved" id="savedChip" aria-pressed="false">Saved <span id="savedCount"></span></button>
</div>

<main id="grid"></main>

<footer class="colophon">Extracted from COLOURBOOK-V1.0_2026.pdf · regenerate with scripts/extract.py · saves live in this browser</footer>

<dialog id="dlg">
  <header><h3 id="dlgTitle"></h3><button id="dlgClose" aria-label="Close">✕</button></header>
  <section id="builder">
    <p class="blab">Core colour<span id="bHint"></span></p>
    <div class="picks" id="bPicks"></div>
    <p class="blab">Neutral palette</p>
    <div class="neuts" id="bNeuts"></div>
    <p class="blab">Preview</p>
    <div class="prev" id="bPrev">
      <h4>Heading</h4>
      <p>Body copy sits on the lightest neutral, set in the second-darkest step.</p>
      <div class="prow"><button type="button">Primary action</button><span class="tag">Accent</span></div>
    </div>
  </section>
  <nav id="dlgTabs"></nav>
  <pre id="dlgCode"></pre>
  <footer>
    <button class="ghost" id="dlgDl">Download</button>
    <button id="dlgCopy">Copy</button>
  </footer>
</dialog>

<div id="toast" role="status"></div>

<script src="colors.js"></script>
<script>
const $ = (s) => document.querySelector(s);

/* ---------- color math ---------- */
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const lum = (hex) => { const [r, g, b] = rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
const ink = (c) => (lum(c) > 0.55 ? "#0A0A0A" : "#FFFFFF");
function hsl(hex) {
  const [r, g, b] = rgb(hex).map((v) => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return [h, s, l];
}
const HUES = [
  ["red", "#D33F2C"], ["orange", "#E8871E"], ["yellow", "#F2C230"],
  ["green", "#4C9A4C"], ["teal", "#2E8C8C"], ["blue", "#3767C8"],
  ["purple", "#7A4FBF"], ["pink", "#D96BB8"], ["neutral", "#9A9285"],
];
function hueFamily(hex) {
  const [h, s, l] = hsl(hex);
  if (s < 0.12 || l > 0.96 || l < 0.05) return "neutral";
  if (h < 15 || h >= 345) return "red";
  if (h < 45) return "orange";
  if (h < 70) return "yellow";
  if (h < 165) return "green";
  if (h < 200) return "teal";
  if (h < 255) return "blue";
  if (h < 290) return "purple";
  return "pink";
}
PALETTES.forEach((p) => (p.hues = new Set(p.colors.map(hueFamily))));

/* ---------- state ---------- */
const saved = new Set(JSON.parse(localStorage.getItem("colorbook-saved") || "[]"));
const state = { q: "", section: null, hue: null, savedOnly: false };
const persist = () => localStorage.setItem("colorbook-saved", JSON.stringify([...saved]));
/* builds[page] = { core: "#RRGGBB"|null, accent: ["#RRGGBB", …], neutral: "Stone"|null } */
const builds = JSON.parse(localStorage.getItem("colorbook-builds") || "{}");
const persistBuilds = () => localStorage.setItem("colorbook-builds", JSON.stringify(builds));

/* ---------- toolbar ---------- */
const sections = [...new Set(PALETTES.map((p) => p.section))];
$("#sections").append(...["All", ...sections].map((s) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s;
  b.setAttribute("aria-pressed", s === "All");
  b.onclick = () => { state.section = s === "All" ? null : s; render(); };
  return b;
}));
$("#dots").append(...HUES.map(([name, swatch]) => {
  const b = document.createElement("button");
  b.className = "dot"; b.title = name; b.setAttribute("aria-label", "hue: " + name);
  b.setAttribute("aria-pressed", "false"); b.style.background = swatch;
  b.onclick = () => { state.hue = state.hue === name ? null : name; render(); };
  return b;
}));
$("#q").oninput = (e) => { state.q = e.target.value.trim().toLowerCase(); render(); };
$("#savedChip").onclick = () => { state.savedOnly = !state.savedOnly; render(); };

/* ---------- render ---------- */
function render() {
  document.querySelectorAll("#sections .chip").forEach((b) =>
    b.setAttribute("aria-pressed", b.textContent === (state.section ?? "All")));
  document.querySelectorAll(".dot").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.title === state.hue)));
  $("#savedChip").setAttribute("aria-pressed", String(state.savedOnly));
  $("#savedCount").textContent = saved.size || "";

  const list = PALETTES.filter((p) =>
    (!state.section || p.section === state.section) &&
    (!state.hue || p.hues.has(state.hue)) &&
    (!state.savedOnly || saved.has(p.page)) &&
    (!state.q || (p.name + " " + p.section + " " + p.colors.join(" ")).toLowerCase().includes(state.q)));

  const grid = $("#grid");
  grid.innerHTML = list.length ? "" : '<p class="empty">No palettes match — loosen a filter.</p>';
  list.forEach((p, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = Math.min(i, 16) * 30 + "ms";
    const bands = p.colors.map((c) =>
      `<button class="band ${lum(c) > 0.55 ? "dk" : "lt"}" style="background:${c}" data-hex="${c}" aria-label="Copy ${c}"><span>${c}</span></button>`).join("");
    card.innerHTML = `
      <div class="bands ${p.colors.length > 12 ? "many" : ""}">${bands}</div>
      <footer>
        <div class="row1"><h3>${p.name}</h3><span class="page">p. ${p.page}</span></div>
        <div class="row2">
          <span class="sec">${p.section}</span>
          <span class="acts">
            <button class="save" aria-pressed="${saved.has(p.page)}" aria-label="Save palette">${saved.has(p.page) ? "saved" : "save"}</button>
            <button class="cpy">copy</button>
            <button class="exp">export</button>
            <button class="bld">${builds[p.page]?.core ? "built" : "build"}</button>
          </span>
        </div>
      </footer>`;
    card.querySelectorAll(".band").forEach((b) => (b.onclick = () => copy(b.dataset.hex, b.dataset.hex + " copied")));
    card.querySelector(".save").onclick = () => { saved.has(p.page) ? saved.delete(p.page) : saved.add(p.page); persist(); render(); };
    card.querySelector(".cpy").onclick = () => copy(p.colors.join(", "), "palette copied");
    card.querySelector(".exp").onclick = () => openExport(p);
    card.querySelector(".bld").onclick = () => openBuild(p);
    grid.append(card);
  });
  $("#meta").textContent = `${list.length} of ${PALETTES.length} palettes · ${sections.length} sections · ${PALETTES.reduce((n, p) => n + p.colors.length, 0)} colours`;
}

/* ---------- copy + toast ---------- */
let toastTimer;
function toast(msg) {
  $("#toast").textContent = msg;
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 1400);
}
function copy(text, msg) {
  (navigator.clipboard?.writeText(text) || Promise.reject()).catch(() => {
    const t = document.createElement("textarea");
    t.value = text; document.body.append(t); t.select();
    document.execCommand("copy"); t.remove();
  });
  toast(msg || "copied");
}

/* ---------- export ---------- */
const slug = (p) => p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
/* a built system carries p.names — semantic keys (core, accent-1, neutral-1) instead of ordinals */
const key = (p, i) => p.names?.[i] ?? `${slug(p)}-${i + 1}`;
/* PDF p.4 — what each tier is for; only meaningful on a built system */
const GUIDE = ["core — key brand moments, used with discipline", "accent — sparingly, for emphasis", "neutral — structure, backgrounds and body copy"];
const guide = (p, open, close = "") => (p.names ? GUIDE.map((l) => `${open}${l}${close}\n`).join("") : "");
const FORMATS = {
  /* roles repeat hexes already listed above them — a flat hex dump stops at p.roleAt */
  hex:  { ext: "txt",  make: (p) => p.colors.slice(0, p.roleAt).join("\n") },
  css:  { ext: "css",  make: (p) => `${guide(p, "/* ", " */")}:root {\n${p.colors.map((c, i) => `  --${key(p, i)}: ${c};`).join("\n")}\n}` },
  scss: { ext: "scss", make: (p) => guide(p, "// ") + p.colors.map((c, i) => `$${key(p, i)}: ${c};`).join("\n") },
  tailwind: { ext: "js", make: (p) => `colors: {\n  "${slug(p)}": {\n${p.colors.map((c, i) => `    "${p.names?.[i] ?? i + 1}": "${c}",`).join("\n")}\n  },\n},` },
  json: { ext: "json", make: (p) => JSON.stringify({ name: p.name, section: p.section, page: p.page, colors: p.colors, ...(p.names && { names: p.names }) }, null, 2) },
  /* W3C design tokens — what Tokens Studio, Style Dictionary and Figma variable importers eat */
  tokens: { ext: "json", make: (p) => JSON.stringify(Object.fromEntries(p.colors.map((c, i) => [key(p, i), { $type: "color", $value: c }])), null, 2) },
};
let dlgPalette, dlgFormat = "hex", dlgBuild = null;
function openExport(p) {
  dlgPalette = p;
  dlgBuild = null;
  $("#dlgTitle").textContent = p.name;
  $("#dlg").classList.remove("build");
  $("#dlgCopy").disabled = $("#dlgDl").disabled = false;
  setFormat(dlgFormat);
  $("#dlg").showModal();
}
function setFormat(f) {
  dlgFormat = f;
  $("#dlgTabs").innerHTML = "";
  $("#dlgTabs").append(...Object.keys(FORMATS).map((k) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", k === f);
    b.onclick = () => setFormat(k);
    return b;
  }));
  $("#dlgCode").textContent = FORMATS[f].make(dlgPalette);
}
$("#dlgClose").onclick = () => $("#dlg").close();
$("#dlg").onclick = (e) => { if (e.target === $("#dlg")) $("#dlg").close(); };
$("#dlg").addEventListener("close", () => { if (dlgBuild) { dlgBuild = null; render(); } });
$("#dlgCopy").onclick = () => copy($("#dlgCode").textContent, dlgFormat + " copied");
$("#dlgDl").onclick = () => {
  const f = FORMATS[dlgFormat];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([f.make(dlgPalette)]));
  a.download = `${slug(dlgPalette)}.${f.ext}`;
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------- build a system (PDF pp. 4–5) ---------- */
const NEUTRALS = PALETTES.filter((p) => p.section === "Neutrals");
const stripBg = (cs) =>
  `linear-gradient(90deg,${cs.map((c, i) => `${c} ${(i / cs.length) * 100}% ${((i + 1) / cs.length) * 100}%`).join(",")})`;

function system(p, b) {
  const n = NEUTRALS.find((x) => x.name === b.neutral);
  const colors = [], names = [];
  if (b.core) { colors.push(b.core); names.push("core"); }
  b.accent.forEach((c, i) => { colors.push(c); names.push(`accent-${i + 1}`); });
  n?.colors.forEach((c, i) => { colors.push(c); names.push(`neutral-${i + 1}`); });
  /* semantic roles — the same hexes again, named for the job they do; neutrals run dark→light, 11 steps */
  const roleAt = colors.length;
  const roles = n ? { bg: n.colors[10], surface: n.colors[9], border: n.colors[8], "text-muted": n.colors[5], text: n.colors[1] } : {};
  if (b.core) roles["core-ink"] = ink(b.core);
  if (b.accent[0]) roles["accent-ink"] = ink(b.accent[0]);
  Object.entries(roles).forEach(([k, c]) => { colors.push(c); names.push(k); });
  return { name: `${p.name} system`, section: p.section, page: p.page, colors, names, neutral: n, roles, roleAt };
}

function openBuild(p) {
  const b = (builds[p.page] ||= { core: null, accent: [], neutral: null });
  /* colors.js can be regenerated under a saved build — drop hexes the palette no longer has */
  b.accent = b.accent.filter((c) => p.colors.includes(c));
  if (!p.colors.includes(b.core)) b.core = null;
  dlgBuild = p;
  $("#dlgTitle").textContent = `${p.name} — system`;
  $("#dlg").classList.add("build");
  renderBuild();
  $("#dlg").showModal();
}

/* first click = core, clicking core again releases it, any other click toggles accent */
function pick(hex) {
  const b = builds[dlgBuild.page];
  if (b.core === hex) b.core = null;
  else if (!b.core) { b.core = hex; b.accent = b.accent.filter((c) => c !== hex); }
  else b.accent = b.accent.includes(hex) ? b.accent.filter((c) => c !== hex) : [...b.accent, hex];
  persistBuilds();
  renderBuild();
}

function renderBuild() {
  const p = dlgBuild, b = builds[p.page];
  /* ponytail: roles keyed by hex, so a palette listing the same hex twice lights up both — same colour, same role */
  $("#bPicks").innerHTML = p.colors.map((c) => {
    const i = b.accent.indexOf(c);
    const role = b.core === c ? "core" : i > -1 ? String(i + 1) : "";
    return `<button class="pick ${role ? "on" : ""} ${lum(c) > 0.55 ? "dk" : "lt"}" style="background:${c}"
      data-hex="${c}" aria-label="${c} — ${role ? (role === "core" ? "core" : "accent " + role) : "eliminated"}"><span>${role}</span></button>`;
  }).join("");
  $("#bPicks").querySelectorAll(".pick").forEach((el) => (el.onclick = () => pick(el.dataset.hex)));

  $("#bNeuts").innerHTML = NEUTRALS.map((n) =>
    `<button class="neut" aria-pressed="${b.neutral === n.name}" style="background:${stripBg(n.colors)}"><b>${n.name}</b></button>`).join("");
  $("#bNeuts").querySelectorAll(".neut").forEach((el, i) => (el.onclick = () => {
    b.neutral = b.neutral === NEUTRALS[i].name ? null : NEUTRALS[i].name;
    persistBuilds();
    renderBuild();
  }));

  $("#bHint").textContent = b.core ? `— ${b.core}` : "— click a swatch";

  dlgPalette = system(p, b);
  const r = dlgPalette.roles;
  $("#bPrev").style.cssText = [
    `--p-bg:${r.bg || "var(--paper)"}`, `--p-ink:${r.text || "var(--ink)"}`,
    `--p-mut:${r["text-muted"] || "var(--mut)"}`, `--p-line:${r.border || "var(--line)"}`,
    `--p-core:${b.core || "var(--ink)"}`, `--p-core-ink:${r["core-ink"] || "var(--paper)"}`,
    `--p-acc:${b.accent[0] || r.border || "var(--line)"}`, `--p-acc-ink:${r["accent-ink"] || "var(--ink)"}`,
  ].join(";");
  $("#dlgCopy").disabled = $("#dlgDl").disabled = !dlgPalette.colors.length;
  setFormat(dlgFormat);
}

render();

/* ponytail: self-check — fails loudly in console if the data or color math breaks */
console.assert(PALETTES.length > 100, "palette count suspicious", PALETTES.length);
console.assert(hueFamily("#FF0000") === "red" && hueFamily("#808080") === "neutral" && hueFamily("#0185FF") === "blue", "hueFamily broken");
console.assert(NEUTRALS.length === 5, "expected 5 neutral scales", NEUTRALS.length);
{
  const s = system({ name: "T", section: "X", page: 0 }, { core: "#111111", accent: ["#222222"], neutral: "Stone" });
  console.assert(s.names.slice(0, 2).join() === "core,accent-1" && s.roleAt === 13, "system() shape", s);
  console.assert(FORMATS.css.make(s).includes("--neutral-11: #FAFAF9;"), "semantic export names broken");
  console.assert(s.roles.bg === "#FAFAF9" && s.roles.text !== s.roles.bg, "roles broken", s.roles);
  const h = FORMATS.hex.make(s).split("\n");
  console.assert(new Set(h).size === h.length && h.length === 13, "hex export repeats role colors", h);
  console.assert(JSON.parse(FORMATS.tokens.make(s))["core"]?.$value === "#111111", "tokens format broken");
}
</script>
</body>
