<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colourbook — palette library</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%228%22 height=%228%22 fill=%22%23C8451F%22/><rect x=%228%22 width=%228%22 height=%228%22 fill=%22%23F2C230%22/><rect y=%228%22 width=%228%22 height=%228%22 fill=%22%233767C8%22/><rect x=%228%22 y=%228%22 width=%228%22 height=%228%22 fill=%22%231D1A16%22/></svg>">
<style>
  @font-face {
    font-family: "Geist";
    src: url("fonts/GeistVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("fonts/GeistMonoVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  /* ============ Graphite Console tokens ============
     Chrome is grayscale — two ladders, a hairline, and one inverse accent. Elevation is lightness,
     never shadow. Every colored pixel on screen belongs to the palettes, which is the point. */
  :root {
    /* surface ladder */
    --bg-0: #0f0f0f;   /* canvas */
    --bg-1: #171717;   /* panel / card */
    --bg-2: #222222;   /* control at rest */
    --bg-3: #2e2e2e;   /* active / selected */
    --bg-4: #3a3a3a;   /* hover on raised */
    --hairline: rgba(255,255,255,.08);

    /* ink ladder */
    --ink-hi: #f2f2f2;
    --ink-mid: #b3b3b3;
    --ink-low: #8a8a8a;
    --ink-faint: #5f5f5f;

    /* inverse pair — the only accent the chrome is allowed */
    --inverse-bg: #ffffff;
    --inverse-ink: #101010;

    /* radius */
    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;

    /* size & rhythm */
    --row-h: 48px;
    --pad-control: 16px;

    --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --ease: cubic-bezier(.25,.1,.25,1);
    --t-fast: 120ms;
    --t-med: 180ms;
  }
  /* dark-only by design — the system commits to one world */
  html { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg-0);
    color: var(--ink-mid);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* building is its own screen — the header, toolbar and grid aren't part of that task, so they
     step out rather than compete with the board for room. Except while picking: an accent can be
     drawn from another page, and the button that does it lives on a card, so the grid has to come
     back or the feature is unreachable — which is exactly what hiding it unconditionally did. */
  body.rail:not(.pick) :is(.masthead, .toolbar, #grid, .colophon) { display: none; }
  body.rail.pick #rail { display: none; }
  @keyframes railin { from { opacity: 0; transform: translateY(6px); } }
  ::selection { background: var(--inverse-bg); color: var(--inverse-ink); }
  :focus-visible { outline: 2px solid var(--ink-low); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* tracked caps belong to section labels alone — controls speak in normal case, like the reference */
  .lab, .neut b, .pnav {
    font-family: var(--font-ui); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  }
  /* selection outlines out-rank the global focus ring — a focused selected control needs its own */
  :is(.cell.on, .step[aria-pressed="true"], .neut[aria-pressed="true"], .dot[aria-pressed="true"], .lsw.on):focus-visible {
    outline: 2px solid var(--ink-hi); outline-offset: 2px;
  }

  header.masthead { padding: clamp(3.5rem, 8vw, 6rem) clamp(1.5rem, 5vw, 5rem) 2.5rem; }
  .masthead h1 {
    color: var(--ink-hi);
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: .96;
  }
  .masthead h1 em { font-style: normal; color: inherit; }
  .masthead .meta {
    margin-top: 2.2rem; padding-top: .9rem; border-top: 1px solid var(--hairline); color: var(--ink-low);
    font-family: var(--font-ui); font-weight: 600; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg-0);
    border-bottom: 1px solid var(--hairline);
    padding: .8rem clamp(1.5rem, 5vw, 5rem);
    display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.5rem;
  }
  /* the search, the way back and the two view chips share the first row; filters take the second */
  .toolbar .search { order: -3; }
  .chip.back { order: -5; }
  .picksys { order: -4; }
  .toolbar .spacer { order: -2; }
  #savedChip, #shelfChip { order: -1; }
  .toolbar .search {
    display: flex; align-items: center; gap: .6rem;
    height: var(--row-h); background: var(--bg-2); border-radius: var(--r-md);
    padding: 0 var(--pad-control); color: var(--ink-faint); width: 17rem;
    transition: background var(--t-fast) var(--ease);
  }
  .toolbar .search:hover { background: var(--bg-3); }
  .toolbar .search:focus-within { outline: 2px solid var(--ink-low); outline-offset: 2px; }
  .toolbar .search svg { flex: none; }
  .toolbar input {
    flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; color: var(--ink-hi);
    background: none; border: 0; outline: none; padding: 0;
  }
  .toolbar input::placeholder { color: var(--ink-faint); }
  #sections { display: flex; flex-wrap: wrap; gap: .15rem .2rem; }
  /* chips: quiet normal-case controls; the active one steps one surface up. Bare in a row they
     filter; inside a bg-2 container (.rtabs, .themes) they read as a segmented control. */
  .chip {
    font-family: var(--font-ui); font-size: 13px; font-weight: 500;
    background: none; border: none; border-radius: 10px; padding: .45rem .85rem; cursor: pointer; color: var(--ink-low);
    transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .chip:hover { color: var(--ink-hi); }
  .chip[aria-pressed="true"] { background: var(--bg-3); color: var(--ink-hi); }
  .chip:disabled { opacity: .35; cursor: default; }
  /* the way back is the loudest chip on the bar */
  .chip.back { background: var(--bg-2); color: var(--ink-hi); }
  .chip.back:hover { background: var(--bg-3); }
  /* while picking, the system rides the toolbar — what you have, next to the way back */
  .picksys { display: inline-flex; gap: 2px; align-items: center; }
  /* display:inline-flex would out-rank the UA's [hidden] rule — an invisible zero-width flex
     item still owns a toolbar gap, which shoved the search 1.5rem off the content edge */
  .picksys[hidden] { display: none; }
  .picksys i { width: .85rem; height: .85rem; border-radius: 3px; border: 1px solid var(--hairline); }
  .dots { display: flex; gap: .8rem; align-items: center; }
  .dot {
    width: .8rem; height: .8rem; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
    cursor: pointer; padding: 0; transition: transform var(--t-fast) var(--ease); position: relative;
  }
  /* the dot stays 13px; the hit area is a transparent 25px overlay, so aiming is not part of the task */
  .dot::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .dot:hover { transform: scale(1.12); }
  .dot[aria-pressed="true"] { outline: 2px solid var(--ink-hi); outline-offset: 2px; }
  .spacer { flex: 1; }

  main {
    padding: 2.5rem clamp(1.5rem, 5vw, 5rem) 6rem;
    display: grid; gap: clamp(1.25rem, 2.2vw, 2rem);
    grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr));
  }
  .card {
    background: var(--bg-1);
    border-radius: var(--r-lg); overflow: hidden;
    display: flex; flex-direction: column;
    animation: rise .45s cubic-bezier(.16,1,.3,1) backwards;
    transition: background var(--t-fast) var(--ease);
  }
  .card:hover { background: var(--bg-2); }
  .card.drawing { outline: 2px solid var(--ink-hi); outline-offset: 2px; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }

  .bands { display: flex; height: 10rem; background: var(--bg-2); }
  .band {
    flex: 1 1 0; min-width: 0; border: none; cursor: copy; padding: .4rem .3rem;
    display: flex; align-items: flex-start; justify-content: center;
    transition: flex-grow .28s cubic-bezier(.16,1,.3,1);
  }
  .band span {
    font-family: var(--font-mono); font-size: .62rem; letter-spacing: .03em;
    opacity: 0; transition: opacity var(--t-med) var(--ease); white-space: nowrap;
  }
  .band:hover, .band:focus-visible { flex-grow: 1.8; }
  .band:hover span, .band:focus-visible span { opacity: 1; }
  .bands.many .band span { writing-mode: vertical-rl; }
  .band.lt { color: rgba(255,255,255,.95); }
  .band.dk { color: rgba(0,0,0,.8); }
  .band span { color: currentColor; }
  /* while drawing accents from this card the bands stop being copy targets and start being picks */
  .card.drawing .band { cursor: pointer; }
  .card.drawing .band.on { outline: 2px solid currentColor; outline-offset: -2px; }
  .card.drawing .band span { opacity: 1; }

  .card footer { padding: 1rem 1.1rem 1.1rem; border-top: 1px solid var(--hairline); }
  .card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .card h3 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--ink-hi); }
  .card .page { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .card .row2 { margin-top: .6rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .card .sec { font-size: 12px; font-weight: 400; color: var(--ink-low); }
  /* the row gap moves into the buttons' own padding, so the target grows without the row growing */
  .acts { display: flex; flex-wrap: wrap; gap: 0 .35rem; margin: -.45rem -.5rem -.45rem 0; }
  .acts button {
    font-family: var(--font-ui); font-size: 13px; font-weight: 500;
    background: none; border: none; border-radius: var(--r-xs); padding: .4rem .5rem; cursor: pointer; color: var(--ink-low);
    transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .acts button:hover { color: var(--ink-hi); }
  .acts .save[aria-pressed="true"], .acts .draw[aria-pressed="true"] { background: var(--bg-3); color: var(--ink-hi); }

  .empty { grid-column: 1 / -1; text-align: center; padding: 6rem 1rem; color: var(--ink-low); font-size: 15px; }

  .colophon {
    border-top: 1px solid var(--hairline); margin: 0 clamp(1.5rem, 5vw, 5rem); padding: 1.2rem 0 3.5rem;
    font-size: 12px; color: var(--ink-faint);
  }

  dialog {
    margin: auto; /* the * reset above removes the UA centering */
    background: var(--bg-1); color: var(--ink-mid); border: 1px solid var(--hairline);
    border-radius: var(--r-xl); overflow: auto;
    padding: 0; width: min(34rem, calc(100vw - 2rem));
    max-height: 92svh;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  /* modal anatomy from the reference: centred title, close ✕ floating top-right */
  dialog header { position: relative; display: flex; justify-content: center; align-items: center; padding: 1.6rem 3rem .9rem; }
  dialog h3 { font-weight: 700; font-size: 20px; letter-spacing: -.01em; color: var(--ink-hi); text-align: center; }
  dialog header button { position: absolute; top: 1.1rem; right: 1.1rem; background: none; border: none; padding: .35rem; cursor: pointer; color: var(--ink-low); display: flex; border-radius: var(--r-xs); transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  dialog header button:hover { color: var(--ink-hi); background: var(--bg-3); }
  dialog p { margin: 0; padding: 0 1.5rem 1.25rem; color: var(--ink-low); font-size: 14px; line-height: 1.55; }

  /* Phosphor glyphs (Fill weight; bare ✕ rides the Bold weight — its Fill variant is plated),
     drawn in currentColor so they sit on the ink ladder and brighten with their label. */
  .i { width: 1.05em; height: 1.05em; display: block; flex: none; }
  dialog nav { display: flex; gap: .2rem; padding: 0 1.5rem .9rem; flex-wrap: wrap; }
  dialog pre {
    margin: 0 1.5rem; padding: 1rem; background: var(--bg-0); border-radius: var(--r-sm);
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-mid);
    max-height: 46vh; overflow: auto;
  }
  dialog footer { display: flex; gap: .6rem; justify-content: flex-end; padding: 1.25rem 1.5rem 1.5rem; }
  .btn {
    font-family: var(--font-ui); font-weight: 600; font-size: 14px;
    border: none; border-radius: var(--r-md); background: var(--inverse-bg); color: var(--inverse-ink);
    height: var(--row-h); padding: 0 22px; cursor: pointer;
    transition: filter var(--t-fast) var(--ease), background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  }
  .btn:hover:not(:disabled) { filter: brightness(.92); }
  .btn.ghost { background: var(--bg-2); color: var(--ink-mid); font-weight: 500; }
  .btn.ghost:hover:not(:disabled) { background: var(--bg-3); color: var(--ink-hi); filter: none; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ================= the rail — where a system is built (book pp. 4–5) ================= */
  #rail {
    position: fixed; inset: 0; margin: 0 auto; width: min(38rem, 100%); z-index: 40;
    background: var(--bg-0);
    display: none; flex-direction: column;
  }
  body.rail #rail { display: flex; animation: railin .3s cubic-bezier(.16,1,.3,1); }

  .rhead { flex: none; padding: 1.1rem 1.25rem .9rem; border-bottom: 1px solid var(--hairline); }
  .rtop { display: flex; align-items: center; gap: .6rem; }
  #rname {
    flex: 1; min-width: 0; font-family: var(--font-ui); font-size: 17px; font-weight: 600; letter-spacing: -.01em;
    background: none; border: none; border-bottom: 1px solid transparent; color: var(--ink-hi);
    padding: .1rem 0; outline: none;
  }
  #rname:hover { border-bottom-color: var(--hairline); }
  #rname:focus { border-bottom-color: var(--ink-low); }
  .rhead .src { display: block; margin-top: .35rem; font-size: 12px; color: var(--ink-low); }
  /* the method as a strip: each segment is a fact about the build and a link to the stage that changes it */
  .rprog { display: flex; flex-wrap: wrap; gap: .1rem .4rem; align-items: baseline; margin-top: .5rem; }
  .rprog button { background: none; border: none; padding: .15rem 0; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; color: var(--ink-low); font-variant-numeric: tabular-nums; transition: color var(--t-fast) var(--ease); }
  .rprog button.done { color: var(--ink-mid); }
  .rprog button:hover { color: var(--ink-hi); }
  .rprog .sep { color: var(--ink-faint); font-size: 11px; }
  /* Build/Export as a full-width segmented control — container bg-2, active segment one step up */
  .rtabs { display: flex; gap: 2px; margin-top: .8rem; background: var(--bg-2); border-radius: var(--r-md); padding: 3px; }
  .rtabs .chip { flex: 1 1 0; text-align: center; padding: .55rem 1rem; font-size: 14px; border-radius: 9px; }
  .rtabs .chip:not([aria-pressed="true"]):hover { color: var(--ink-mid); background: none; }
  .ricon { background: none; border: none; padding: .4rem; cursor: pointer; color: var(--ink-low); font-size: 1rem; line-height: 1; display: flex; border-radius: var(--r-xs); transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .ricon:hover { color: var(--ink-hi); background: var(--bg-3); }

  .rbody { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 1.25rem 1.4rem; }
  .rbody.export { display: flex; flex-direction: column; padding-bottom: 0; }
  /* The preview is ~800px of page. At the end of a 1600px scroller you had to scroll away from every
     control to see it. Its own pane keeps it in shot while the board, tiles and ladder scroll above.
     Empty on the export tab, where it collapses to nothing. #rPrev, not .prev — the compare tray
     uses the same node and must stay full height. */
  /* The pane keeps its size and the controls absorb the window — they already scroll, and a preview
     that shrinks to a strip is worth less than one you can read. `min-height: 0` on .rbody is what
     lets it yield: without it a flex item refuses to shrink past its content and the action bar
     ends up sitting on top of the preview. */
  .rprev:not(:empty) {
    flex: 0 0 auto; display: flex; flex-direction: column; overflow: hidden;
    border-top: 1px solid var(--hairline); padding: 0 1.25rem .9rem;
  }
  .rprev .lab { flex: none; margin-top: .75rem; }
  #rPrev { flex: none; max-height: min(32svh, 20rem); overflow: auto; overscroll-behavior: contain; }
  .ract { flex: none; border-top: 1px solid var(--hairline); padding: .85rem 1.25rem; display: flex; gap: .55rem; }
  .ract .btn { flex: 1; padding: 0 .5rem; text-align: center; }

  /* Wide screens: controls left, preview right. Stacked, the preview could only ever have the ~32svh
     the controls could spare it; beside them it gets the full height of the window and is finally
     judged as a page. The export tab has no preview, so it drops back to one centred column.
     This block sits after the rules it overrides — a media query adds no specificity, so above them
     the base .rprev/#rPrev declarations would simply win. */
  @media (min-width: 60rem) {
    #rail { width: auto; }
    body.rail #rail {
      display: grid; grid-template-columns: min(34rem, 46%) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "head prev" "body prev" "act prev";
    }
    .rhead { grid-area: head; }
    .rbody { grid-area: body; }
    .ract  { grid-area: act; }
    .rprev:not(:empty) {
      grid-area: prev; border-top: none; border-left: 1px solid var(--hairline); padding: 0 1.4rem 1.3rem;
    }
    /* uncapped, this track grows with the window past any window a "page" is meant to be judged at —
       50rem matches the ~800px the pane exists to show, so it stops stretching past every ordinary desktop width */
    #rPrev { flex: 1 1 auto; max-height: none; width: 100%; max-width: 50rem; margin: 0 auto; }
    /* export: nothing to sit beside, so the code column centres instead of stretching to 1600px */
    body.rail #rail:has(.rbody.export) {
      grid-template-columns: min(52rem, 100%); grid-template-areas: "head" "body" "act";
      justify-content: center;
    }
  }

  .lab {
    font-size: 11px; color: var(--ink-low);
    margin: 1.6rem 0 .6rem;
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem .75rem;
  }
  .lab .act { font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-mid); background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-ui); transition: color var(--t-fast) var(--ease); }
  .lab .act:hover { color: var(--ink-hi); }
  .lab .tally { color: var(--ink-faint); font-family: var(--font-mono); letter-spacing: .02em; text-transform: none; font-variant-numeric: tabular-nums; }
  .themes { display: flex; flex-wrap: wrap; gap: .1rem .15rem; }
  .themes .chip { text-transform: capitalize; }
  /* format pickers are acronym rows — the one place the control voice stays uppercase */
  dialog nav .chip, .rbody.export nav .chip { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .pctrls { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .8rem; }

  /* ---- ramp board: the palette regrouped into the tint/shade columns the book prints ----
     Columns run to a common height and their cells share it, so a two-step ramp and a five-step
     ramp both read as ramps instead of leaving a staircase of holes down the right of the rail. */
  .board { display: flex; gap: 1px; height: calc(var(--rows) * 2.35rem); border-radius: var(--r-sm); overflow: hidden; }
  .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; gap: 1px; }
  .cell {
    position: relative; border: none; padding: 0; cursor: pointer; flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05rem;
    transition: flex-grow var(--t-med) var(--ease);
  }
  .cell.lt { color: rgba(255,255,255,.95); }
  .cell.dk { color: rgba(0,0,0,.8); }
  .cell.core { flex-grow: 1.7; }
  .cell span { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .04em; color: currentColor; }
  .cell .rl { font-family: var(--font-ui); font-weight: 600; font-size: .5rem; letter-spacing: .16em; text-transform: uppercase; }
  .cell.on { outline: 2px solid currentColor; outline-offset: -2px; z-index: 1; }
  /* the top 40% of a cell sets the core; a hairline draws the split on hover so the two targets are visible */
  .cell::before {
    content: ""; position: absolute; inset: 0 0 60% 0; pointer-events: none;
    border-bottom: 1px solid currentColor; opacity: 0; transition: opacity var(--t-fast) var(--ease);
  }
  .cell:hover::before, .cell:focus-visible::before { opacity: .8; }
  .cell.core::before { display: none; }
  /* An unchosen swatch used to answer nothing on hover — not its hex, not what the hairline divided.
     Now the top zone names itself and the hex reads out, so both targets are discoverable in place
     instead of only in the screen-reader instructions. */
  .cell .cue { position: absolute; top: .28rem; left: 0; right: 0; text-align: center; }
  .cell .cue, .cell .hx { opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .cell:hover .cue, .cell:focus-visible .cue,
  .cell:hover .hx, .cell:focus-visible .hx { opacity: 1; }
  /* the hovered swatch reads as the target without growing — a swelling cell drags every neighbour
     in the column with it, which makes scanning a ramp feel like walking on a waterbed */
  .cell:not(.on):hover, .cell:not(.on):focus-visible { box-shadow: inset 0 0 0 1px currentColor; z-index: 2; }
  /* eliminated stays in full colour and gets struck — you cannot judge a colour you cannot see */
  .cell.out { opacity: .72; }
  .cell.out::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .75;
    background: linear-gradient(to top right, transparent calc(50% - .5px), currentColor calc(50% - .5px), currentColor calc(50% + .5px), transparent calc(50% + .5px));
  }

  /* large swatches: the same board, sized for judging colour (and for fingers) */
  .board.big { height: calc(var(--rows) * 3.4rem); }
  .bigcell span { opacity: 1; }

  /* list: every verb a labelled button — the arrangement where nothing hides in a hover or a cap */
  .blist { display: flex; flex-direction: column; }
  .lrow { display: flex; align-items: center; gap: .7rem; padding: .3rem 0; border-bottom: 1px solid var(--hairline); }
  .lrow .lsw { width: 2.2rem; height: 1.5rem; border: none; border-radius: var(--r-xs); cursor: pointer; flex: none; }
  .lrow .lsw.on { outline: 2px solid var(--ink-hi); outline-offset: 1px; }
  .lrow.out .lsw { opacity: .55; }
  .lrow .lhex { font-family: var(--font-mono); font-size: 12px; width: 4.4rem; color: var(--ink-mid); }
  .lrow.out .lhex { text-decoration: line-through; color: var(--ink-faint); }
  .lrow .lrole { flex: 1; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--ink-low); }
  .lrow .act { font-family: var(--font-ui); font-weight: 500; font-size: 13px; color: var(--ink-mid); background: none; border: none; padding: .3rem 0; cursor: pointer; transition: color var(--t-fast) var(--ease); }
  .lrow .act:hover { color: var(--ink-hi); }

  /* ---- the tray: the system itself, chip by chip. The one surface where a build is listed whole —
          including accents borrowed from pages the board can't show — and picked apart or reordered. ---- */
  .tray { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; min-height: 2.75rem; border: 1px dashed rgba(255,255,255,.22); border-radius: var(--r-md); padding: .45rem; }
  .tray .none { font-size: 13px; font-weight: 500; color: var(--ink-faint); padding: 0 .4rem; }
  .tchip { display: inline-flex; align-items: center; gap: .45rem; background: var(--bg-2); border-radius: var(--r-pill); padding: .35rem .7rem .35rem .4rem; position: relative; transition: background var(--t-fast) var(--ease); }
  .tchip:hover { background: var(--bg-3); }
  .tchip:focus-visible { outline: 2px solid var(--ink-low); outline-offset: 2px; }
  .tchip.lifting { opacity: .3; }
  .tchip i { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 1px solid var(--hairline); }
  .tchip .tl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--ink-low); }
  .tchip code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-hi); }
  .tchip .tp { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
  .tchip.corechip { background: var(--bg-3); cursor: pointer; }
  .tx { background: none; border: none; padding: .1rem; margin: 0 -.25rem 0 -.15rem; cursor: pointer; color: var(--ink-low); display: flex; opacity: 0; transition: opacity var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .tx .i { width: .85em; height: .85em; }
  .tchip:hover .tx, .tchip:focus-within .tx { opacity: 1; }
  .tx:hover { color: var(--ink-hi); }
  @media (pointer: coarse) { .tx { opacity: 1; } }

  /* Five 1.5rem ramp strips were near-indistinguishable, and Neutral and Zinc genuinely share their
     light bg (#FAFAFA) — a plain colour field could not tell those two apart at all. So each scale is
     shown as the page it makes: surface, border and text carry the undertone the ramp hides. */
  .neuts {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(4.5rem, 1fr);
    gap: 1px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: thin;
    border-radius: var(--r-sm);
  }
  /* flex, not block: a button with a fixed height centres its content box, which floats the nav bar
     off the top edge and stops the tile reading as a page */
  .neut {
    border: none; padding: 0; cursor: pointer; scroll-snap-align: start; text-align: left;
    height: 7rem; display: flex; flex-direction: column; align-items: stretch;
    background: var(--t-bg); outline-offset: -2px;
  }
  .neut > * { flex: none; }
  .neut:hover { outline: 1px solid var(--ink-low); outline-offset: -1px; }
  .neut[aria-pressed="true"] { outline: 2px solid var(--ink-hi); }
  /* the name rides the nav bar in the scale's own text colour — the label is itself a text-on-surface sample */
  .neut b {
    display: block; background: var(--t-surface); border-bottom: 1px solid var(--t-line); color: var(--t-ink);
    padding: .3rem .4rem; font-size: .5rem; letter-spacing: .08em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* bars, not copy: at 4.5rem wide real text is illegible, and the undertone is what's being judged */
  .neut i { display: block; height: .18rem; background: var(--t-mut); margin: .28rem .4rem 0; }
  .neut i.h { height: .3rem; width: 62%; background: var(--t-ink); margin-top: .5rem; }
  .neut i.s { width: 68%; }
  .neut i.c { height: .62rem; width: 58%; background: var(--t-core); margin-top: .5rem; }

  /* ---- role ladder: which of the 11 steps each role reads, and what that costs in contrast ---- */
  /* the summary carries the .lab voice and its own caret — the default triangle sits off the baseline */
  details.roles > summary { cursor: pointer; list-style: none; }
  details.roles > summary::-webkit-details-marker { display: none; }
  details.roles > summary > span:first-child::after { content: " +"; font-family: var(--font-mono); }
  details.roles[open] > summary > span:first-child::after { content: " −"; }
  details.roles > summary:hover { color: var(--ink-hi); }
  .lad { display: grid; grid-template-columns: 5.4rem 1fr; gap: .35rem .6rem; align-items: center; }
  .lad > .rn { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--ink-low); }
  .lad > .rn.moved { color: var(--ink-hi); }
  .steps { display: flex; gap: 1px; border-radius: var(--r-xs); overflow: hidden; }
  .step { flex: 1 1 0; height: 1.15rem; border: none; padding: 0; cursor: pointer; position: relative; }
  .step[aria-pressed="true"] { outline: 2px solid var(--ink-hi); outline-offset: -2px; z-index: 2; }
  /* ghost mark — the nearest step that clears AA, shown before you click it */
  .step.fix::after {
    content: ""; position: absolute; inset: auto .18rem .18rem .18rem; height: 2px;
    background: var(--inverse-bg); box-shadow: 0 0 0 1px rgba(0,0,0,.6);
  }
  .lad .rd { grid-column: 2; margin: -.15rem 0 .15rem; font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .lad .rd.bad { color: var(--ink-hi); font-weight: 500; }
  .lad .rd.bad::before { content: "⚠ "; }
  .rx { background: none; border: none; padding: .1rem; margin-left: .35rem; cursor: pointer; color: var(--ink-low); display: inline-flex; vertical-align: -.15em; transition: color var(--t-fast) var(--ease); }
  .rx .i { width: .85em; height: .85em; }
  .rx:hover { color: var(--ink-hi); }

  /* the ramp as a drag source — the same eleven steps the ladder reads, liftable onto a role or the page */
  .rstrip { display: flex; gap: 1px; margin: .2rem 0 0; border-radius: var(--r-xs); overflow: hidden; }
  .rstrip .rstep { flex: 1 1 0; height: 1.7rem; }
  .rstrip .rstep:hover { box-shadow: inset 0 0 0 1px currentColor; }
  .rstep.lt { color: rgba(255,255,255,.95); }
  .rstep.dk { color: rgba(0,0,0,.8); }
  .stripcue { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; color: var(--ink-low); margin: .3rem 0 .6rem; }

  /* ---- drag: what's liftable says so, what's under a lift says what it would mean ---- */
  .grab { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  /* .dghost, not .ghost — the rail's secondary buttons already own that name.
     The lifted chip is the system's one glow — an interactive handle in flight, like the pad dot. */
  .dghost { position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; display: flex; align-items: center; gap: .45rem; background: var(--inverse-bg); color: var(--inverse-ink); border-radius: var(--r-pill); padding: .3rem .8rem .3rem .35rem; font-size: 12px; letter-spacing: .04em; font-weight: 600; box-shadow: 0 0 14px 5px rgba(255,255,255,.18); }
  .dghost i { width: 1rem; height: 1rem; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); }
  .dghost .gbadge { font-family: var(--font-mono); font-weight: 500; letter-spacing: .02em; }
  .dghost .gbadge:empty { display: none; }
  [data-drop].dropok { outline: 2px solid currentColor; outline-offset: -2px; }
  [data-drop].dropbad { outline: 2px dashed currentColor; outline-offset: -2px; opacity: .85; }
  @keyframes flashp { 0%, 55% { outline: 2px solid currentColor; outline-offset: -2px; } 100% { outline: 2px solid transparent; outline-offset: -2px; } }
  .flash { animation: flashp .9s ease-out; }
  @keyframes shk { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
  .shake { animation: shk .3s; }

  /* ---- preview: a page, not a card — nav, body, quote, field and footer, so bg/surface/border/text
          and both ink pairings are all on screen at once. Painted entirely by the built system's own
          colours (--p-*) — the one place the chrome's grayscale rules do not reach, by design. ---- */
  .unbuilt {
    border: 1px dashed rgba(255,255,255,.22); border-radius: var(--r-md); padding: 1.7rem 1.2rem; text-align: center;
    font-weight: 500; font-size: 13px; color: var(--ink-faint);
  }
  /* bg, surface and border are meant to sit close together — they only read as three roles when adjacent */
  .prev { border: 1px solid var(--p-line); border-radius: var(--r-lg); overflow: hidden; background: var(--p-bg); color: var(--p-ink); container-type: inline-size; }
  .prev * { border-color: var(--p-line); }
  .pnav {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    background: var(--p-surface); border-bottom: 1px solid var(--p-line); padding: .55rem .8rem;
    font-size: .55rem; color: var(--p-mut);
  }
  .pnav .brand { color: var(--p-ink); }
  .pnav .pill { background: var(--p-core); color: var(--p-core-ink); border-radius: 999px; padding: .3rem .6rem; }
  .pbody { padding: 1.1rem 1rem; }
  .prev h4 { font-size: 1.1rem; font-weight: 500; letter-spacing: -.015em; line-height: 1.15; }
  .prev p { font-size: .78rem; line-height: 1.6; margin: .5rem 0 0; }
  .prev .pcap { color: var(--p-mut); }
  .prow { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .9rem; }
  .prev .pbtn {
    font-family: var(--font-ui); font-weight: 500; font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
    background: var(--p-core); color: var(--p-core-ink); border: 1px solid var(--p-core); border-radius: 9px; padding: .55rem 1.1rem; cursor: default;
  }
  .prev .pbtn.sec { background: transparent; color: var(--p-ink); border-color: var(--p-line); }
  .ptags { display: flex; flex-wrap: wrap; gap: .3rem; }
  .prev .tag { font-family: var(--font-mono); font-size: .58rem; border-radius: 6px; padding: .25rem .5rem; }
  /* the tool annotating the page: a failing text pairing stays pinned to the region it breaks,
     for as long as it is true. Chrome voice — opaque graphite — so the chip stays legible on
     any user palette, including the broken one it is reporting. */
  .pwarn {
    position: absolute; top: .3rem; right: .3rem; z-index: 3;
    background: var(--bg-0); color: var(--ink-hi); border: 1px solid rgba(255,255,255,.14);
    border-radius: var(--r-xs); padding: .18rem .5rem;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; font-variant-numeric: tabular-nums;
    cursor: pointer; transition: background var(--t-fast) var(--ease);
  }
  .prev .pwarn { border-color: rgba(255,255,255,.14); }
  .pwarn:hover { background: var(--bg-2); }
  .psec { border-top: 1px solid var(--p-line); padding: 1rem; }
  .prev blockquote { font-size: .95rem; line-height: 1.4; letter-spacing: -.01em; border-left: 2px solid var(--p-core); padding-left: .75rem; }
  .pfield { background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 9px; padding: .5rem .6rem; font-size: .72rem; color: var(--p-mut); margin-top: .35rem; }
  .pfield.focus { outline: 2px solid var(--p-core); outline-offset: 1px; color: var(--p-ink); }
  .plabel { font-size: .55rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: var(--p-mut); }
  .pfoot { border-top: 1px solid var(--p-line); background: var(--p-surface); padding: .7rem .8rem; font-size: .58rem; color: var(--p-mut); display: flex; justify-content: space-between; gap: .5rem; }

  /* ---- the other pages: each preview template leans on a different part of the system,
          so a weakness that one page hides, another shows ---- */
  .pxl { font-size: 1.7rem; font-weight: 500; letter-spacing: -.03em; line-height: 1.06; }
  .prev a { color: var(--p-core); text-underline-offset: 3px; }
  .pcode { font-family: var(--font-mono); font-size: .66rem; background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 5px; padding: .06rem .3rem; }
  .ptiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .8rem; }
  .ptile { background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 9px; padding: .55rem .65rem; min-width: 0; }
  .ptile b { display: block; font-size: 1.05rem; font-weight: 500; letter-spacing: -.02em; margin-top: .2rem; }
  .ptable { margin-top: .8rem; border: 1px solid var(--p-line); border-radius: 9px; overflow: hidden; }
  .ptr { display: grid; grid-template-columns: 2fr .9fr .8fr; gap: .5rem; padding: .45rem .6rem; border-top: 1px solid var(--p-line); font-size: .68rem; align-items: center; }
  .ptr:first-child { border-top: none; background: var(--p-surface); color: var(--p-mut); font-size: .55rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
  .ptag2 { justify-self: start; font-family: var(--font-mono); font-size: .56rem; border-radius: 5px; padding: .12rem .4rem; }
  .pchk { display: flex; gap: .5rem; align-items: center; margin-top: .9rem; font-size: .74rem; }
  .pchk i { width: .8rem; height: .8rem; border-radius: 4px; background: var(--p-core); flex: none; }
  .pbtn.dis { background: var(--p-surface); color: var(--p-mut); border-color: var(--p-line); }
  .pchart { display: block; width: 100%; margin-top: .7rem; }
  .plegend { display: flex; gap: .9rem; flex-wrap: wrap; margin-top: .45rem; }
  .plegend span { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--font-mono); font-size: .58rem; color: var(--p-mut); }
  .plegend i { width: .7rem; height: .7rem; border-radius: 3px; }

  /* palette view: proportional colour field, no UI chrome — same swatch vocabulary as .cell
     (rl label + mono hex) but always shown, since this sheet is read, not clicked. */
  .pal { border: 1px solid var(--hairline); border-radius: var(--r-lg); overflow: hidden; }
  .pf-field, .pf-row, .pf-ramp { display: flex; }
  .pf-field { min-height: 6rem; }
  .pf-row { min-height: 5rem; border-top: 1px solid var(--hairline); }
  .pf-ramp { min-height: 2.4rem; border-top: 1px solid var(--hairline); }
  .pf-sw { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; }
  .pf-sw.lt { color: rgba(255,255,255,.95); }
  .pf-sw.dk { color: rgba(0,0,0,.8); }
  .pf-sw span { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .04em; color: currentColor; }
  .pf-sw .rl { font-family: var(--font-ui); font-weight: 600; font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; }
  .pf-ramp .pf-sw .rl { display: none; }
  .pf-ramp .pf-sw span:last-child { font-size: .48rem; }

  /* ---- export owns the rail floor when export is the task ---- */
  .rbody.export nav { display: flex; gap: .2rem; flex-wrap: wrap; padding: 1rem 0 .7rem; flex: none; }
  .rbody.export pre {
    flex: 1; min-height: 18rem; margin: 0 0 1.15rem; padding: 1rem;
    background: var(--bg-1); border-radius: var(--r-md);
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-mid); overflow: auto;
  }
  .exsum { margin-top: 1.4rem; background: var(--bg-1); border: none; border-radius: var(--r-md); padding: .8rem .9rem; cursor: pointer; width: 100%; text-align: left; transition: background var(--t-fast) var(--ease); }
  .exsum:hover { background: var(--bg-2); }
  .exsum b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--ink-low); }
  .exsum code { display: block; margin-top: .35rem; font-family: var(--font-mono); font-size: 12px; color: var(--ink-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- shelf: how you recognise a system three weeks later ---- */
  .shelf .card footer { border-top: none; }
  .shelfstrip { display: flex; height: 5rem; }
  .shelfstrip i { flex: 1 1 0; }
  .shelf .card.pin { outline: 2px solid var(--ink-hi); outline-offset: 2px; }

  /* ---- compare tray: candidates side by side on one scroll ---- */
  #cmp { position: fixed; inset: 0; z-index: 60; background: var(--bg-0); display: none; flex-direction: column; }
  body.cmp #cmp { display: flex; }
  body.cmp { overflow: hidden; }
  .cmphead { flex: none; border-bottom: 1px solid var(--hairline); padding: .9rem clamp(1rem, 3vw, 2rem); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .cmphead h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-hi); }
  .cmpbody { flex: 1; overflow: auto; display: flex; align-items: flex-start; background: var(--bg-0); }
  .cmpcol { flex: 1 1 0; min-width: 17rem; background: var(--bg-0); }
  .cmpcol + .cmpcol { border-left: 1px solid var(--hairline); }
  .cmpname { padding: .7rem .8rem; border-bottom: 1px solid var(--hairline); background: var(--bg-1); position: sticky; top: 0; z-index: 1; }
  .cmpname b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; color: var(--ink-hi); }
  .cmpname span { font-size: 12px; color: var(--ink-low); }

  /* the toast borrows the inverse pair — the loudest thing the chrome is allowed to be */
  #toast {
    position: fixed; left: 50%; bottom: 1.75rem; translate: -50% 0; z-index: 70;
    background: var(--inverse-bg); color: var(--inverse-ink); font-size: 13px; font-weight: 600; letter-spacing: .01em;
    border-radius: var(--r-pill); padding: .65rem 1.2rem; font-variant-numeric: tabular-nums;
    opacity: 0; pointer-events: none; transition: opacity .25s, translate .25s;
  }
  #toast.show { opacity: 1; translate: -50% -4px; pointer-events: auto; }
  #toast .tundo { background: none; border: none; color: inherit; font: inherit; letter-spacing: inherit; margin-left: 1rem; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  @media (max-width: 900px) {
    .cmpcol { min-width: 82vw; }
    .cmpbody { scroll-snap-type: x mandatory; }
    .cmpcol { scroll-snap-align: start; }
  }
  /* a coarse pointer is the actual thing being served here, not a narrow window */
  @media (pointer: coarse) {
    .board { height: calc(var(--rows) * 3rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<!--
THESIS: a dark monochrome console where the 202 palettes are the only colour on screen — refusing the gallery-white swatch-site default.
OWN-WORLD: Graphite Console — 5-step grayscale surface ladder (#0f0f0f→#3a3a3a, elevation is lightness, no shadows), 4-step ink ladder, white inverse pair as the sole accent, hairline dividers; tracked caps for section labels only, controls in normal-case 13–14px/500 like the Arqé source app; segmented controls (container bg-2, active segment bg-3), Geist + Geist Mono self-hosted, Phosphor Fill glyphs.
STORY: Sanna opens the library, the chrome recedes, colour reads true against neutral graphite; she filters, builds a system, exports code.
FIRST VIEWPORT: COLOURBOOK wordmark in one colour (ink-hi) over a hairline meta line; sticky graphite toolbar — magnifier search field with Saved/Systems beside it, normal-case section chips and hue dots below; palette cards as bg-1 panels whose bands carry all the colour.
FORM: Graphite Console, user-pinned (adopted from image-compressor, tightened against Arqé app screenshots mid-build) — pinned direction beats the roll, no seed key.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<script src="colors.js"></script>
<script src="brands.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

/* ---------- color math ---------- */
const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const lum = (hex) => { const [r, g, b] = rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
const ink = (c) => (lum(c) > 0.55 ? "#0A0A0A" : "#FFFFFF");
/* WCAG relative luminance — lum() above is perceptual brightness for picking a label colour,
   not a number anyone should quote to an engineer. A stated ratio has to be the real one. */
const rl = (hex) => rgb(hex).map((v) => v / 255)
  .reduce((a, v, i) => a + (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4) * [0.2126, 0.7152, 0.0722][i], 0);
const ratio = (a, b) => { const [hi, lo] = [rl(a), rl(b)].sort((m, n) => n - m); return (hi + 0.05) / (lo + 0.05); };
const grade = (r) => (r >= 7 ? "AAA" : r >= 4.5 ? "AA" : r >= 3 ? "large text only" : "fails");
/* round DOWN: toFixed turns 6.995 into "7.0" and then grade() calls it AA, which reads as a bug
   to whoever is holding the CSS file. A stated ratio must never contradict its own grade. */
const fmt = (r) => (Math.floor(r * 10) / 10).toFixed(1);
const contrast = (a, b) => { const r = ratio(a, b); return `${fmt(r)}:1 ${grade(r)}`; };
function hsl(hex) {
  const [r, g, b] = rgb(hex).map((v) => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return [h, s, l];
}
const HUES = [
  ["red", "#D33F2C"], ["orange", "#E8871E"], ["yellow", "#F2C230"],
  ["green", "#4C9A4C"], ["teal", "#2E8C8C"], ["blue", "#3767C8"],
  ["purple", "#7A4FBF"], ["pink", "#D96BB8"], ["neutral", "#9A9285"],
];
const HUE_ORDER = HUES.map(([n]) => n);
function hueFamily(hex) {
  const [h, s, l] = hsl(hex);
  if (s < 0.12 || l > 0.96 || l < 0.05) return "neutral";
  if (h < 15 || h >= 345) return "red";
  if (h < 45) return "orange";
  if (h < 70) return "yellow";
  if (h < 165) return "green";
  if (h < 200) return "teal";
  if (h < 255) return "blue";
  if (h < 290) return "purple";
  return "pink";
}
/* brands.js is the one authored palette source (colors.js never is) — merged here, before
   anything derives from PALETTES, so brands filter, build, export and share like book pages */
if (typeof BRANDS !== "undefined") PALETTES.push(...BRANDS);
/* brand sections are "Brands · <strategy>" — the prefix is the marker, the suffix is the filter */
const isBrand = (p) => !!p?.section?.startsWith("Brands");
/* brands carry a synthetic page id (≥900) that must never reach the eye — it is a key, not a fact */
const pageLabel = (p) => (isBrand(p) ? "brand" : `p. ${p.page}`);
PALETTES.forEach((p) => (p.hues = new Set(p.colors.map(hueFamily))));
const byPage = new Map(PALETTES.map((p) => [p.page, p]));

/* ---------- ramps: the book prints tints/shades in columns, extract.py flattens them ----------
   p.colors is pdftotext's reading order, which is NOT the printed grid — p.71 and p.72 disagree
   on structure. So column order has to be derived from the colours themselves: hue family for the
   column, luminance for the step. That makes accent-1 a fact about the colour, not about the mouse. */
const MAX_ROWS = 8; /* ponytail: past this a column is taller than the rail — fall back to flat */
function ramps(colors) {
  const g = new Map();
  colors.forEach((c) => { const f = hueFamily(c); (g.get(f) || g.set(f, []).get(f)).push(c); });
  const cols = [...g.entries()]
    /* neutral last (it is the palette's own greys, not a hue), then biggest column first */
    .sort((a, b) => (a[0] === "neutral") - (b[0] === "neutral") || b[1].length - a[1].length ||
      HUE_ORDER.indexOf(a[0]) - HUE_ORDER.indexOf(b[0]))
    .map(([fam, cs]) => ({ fam, cs: cs.slice().sort((x, y) => lum(x) - lum(y)) }));
  const tallest = Math.max(...cols.map((c) => c.cs.length));
  return { cols, flat: tallest > MAX_ROWS };
}
/* a hex's rank in the board: column index, then step. Unplaced (drawn from another page) sorts last. */
function rankIn(cols, hex) {
  for (let i = 0; i < cols.length; i++) {
    const j = cols[i].cs.indexOf(hex);
    if (j >= 0) return i * 100 + j;
  }
  return 9999 + HUE_ORDER.indexOf(hueFamily(hex)) * 100 + lum(hex) * 10;
}

/* ---------- state ---------- */
/* localStorage is the only store there is — one hand-corrupted key must not take the page with it */
const load = (k, fb) => { try { return JSON.parse(localStorage.getItem(k) ?? fb); } catch { return JSON.parse(fb); } };
/* …and syntax is only half of corrupt. `3` and `null` parse fine, then `new Set(3)` and
   Object.entries(null) throw at the top level and take the whole script — checks included — with
   them. Every store here is an array or a plain object, so say so once and coerce at the door. */
const arr = (v) => (Array.isArray(v) ? v : []);
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
/* a system name is user text and arrives from shared links — never interpolate one raw */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const saved = new Set(arr(load("colorbook-saved", "[]")));
const persist = () => localStorage.setItem("colorbook-saved", JSON.stringify([...saved]));
const state = { q: "", section: null, hue: null, savedOnly: false, view: "grid" };
/* app-level view preferences — how she looks at a build, never what the build is:
   not part of the system record, and never in a share hash */
const ui = obj(load("colorbook-ui", "{}"));
const saveUI = () => localStorage.setItem("colorbook-ui", JSON.stringify(ui));
const BOARD_VIEWS = ["ramps", "grid", "list", "large"];
const boardView = () => (BOARD_VIEWS.includes(ui.board) ? ui.board : "ramps");
const previewTpl = () => (TEMPLATES[ui.tpl] ? ui.tpl : "page");

/* A system is a named record, not a slot on a page: one palette can carry three candidates.
   { id, page, name, core, accent[], src{hex:page}, out[], neutral, dark, roles{role:step}, order, at }
   order: null means accent order is derived from the board; an array is a dragged, deliberate order. */
const SYS_KEY = "colorbook-systems";
const uid = () => Math.random().toString(36).slice(2, 8);
const blank = (page, name) => ({
  id: uid(), page, name: name || byPage.get(page)?.name || `p. ${page}`,
  core: null, accent: [], src: {}, out: [], neutral: null, dark: false, roles: {}, order: null, at: new Date().toISOString().slice(0, 10),
});
/* v1 kept one build per palette page. Every core-bearing entry becomes a named system; empty ones
   are skipped. colorbook-builds is read, never written or cleared, so the old data survives. */
const migrate = (v1) => Object.entries(obj(v1)).filter(([, b]) => b && b.core).map(([page, b]) =>
  Object.assign(blank(+page), { core: b.core, accent: arr(b.accent), neutral: b.neutral || null, dark: !!b.dark }));
/* only a real array counts as v2 data — anything else is corrupt, and v1 is still there to fall back on */
const v2 = load(SYS_KEY, "null");
let systems = Array.isArray(v2) ? v2 : migrate(load("colorbook-builds", "{}"));
const persistSystems = () => localStorage.setItem(SYS_KEY, JSON.stringify(systems));
const sysById = (id) => systems.find((s) => s.id === id);
const sysOf = (page) => systems.filter((s) => s.page === page);
const pinned = new Set();

let open = null;      /* the system in the rail */
let tab = "build";
let drawFrom = null;  /* page whose card is currently lending accents to the open system */
let picking = false;  /* the rail stepped aside so the grid can be browsed for a page to draw from */
let flashRole = null; /* a role that just changed — the next render pulses its preview region */

/* ---------- toolbar ---------- */
const sections = [...new Set(PALETTES.map((p) => p.section))];
$("#sections").append(...["All", ...sections].map((s) => {
  const b = el("button", "chip"); b.textContent = s;
  b.setAttribute("aria-pressed", s === "All");
  b.onclick = () => { state.section = s === "All" ? null : s; state.view = "grid"; render(); };
  return b;
}));
$("#dots").append(...HUES.map(([name, swatch]) => {
  const b = el("button", "dot");
  b.title = name; b.setAttribute("aria-label", "hue: " + name);
  b.setAttribute("aria-pressed", "false"); b.style.background = swatch;
  b.onclick = () => { state.hue = state.hue === name ? null : name; state.view = "grid"; render(); };
  return b;
}));
$("#q").oninput = (e) => { state.q = e.target.value.trim().toLowerCase(); state.view = "grid"; render(); };
$("#savedChip").onclick = () => { state.savedOnly = !state.savedOnly; state.view = "grid"; render(); };
$("#shelfChip").onclick = () => { state.view = state.view === "shelf" ? "grid" : "shelf"; render(); };
$("#backChip").onclick = () => { picking = false; drawFrom = null; render(); };

/* ---------- render ---------- */
function render() {
  document.querySelectorAll("#sections .chip").forEach((b) =>
    b.setAttribute("aria-pressed", b.textContent === (state.section ?? "All")));
  document.querySelectorAll(".dot").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.title === state.hue)));
  $("#savedChip").setAttribute("aria-pressed", String(state.savedOnly));
  $("#savedCount").textContent = saved.size || "";
  $("#shelfChip").setAttribute("aria-pressed", String(state.view === "shelf"));
  $("#builtCount").textContent = systems.length || "";
  state.view === "shelf" ? renderShelf() : renderGrid();
  renderRail();
}

function renderGrid() {
  const list = PALETTES.filter((p) =>
    (!state.section || p.section === state.section) &&
    (!state.hue || p.hues.has(state.hue)) &&
    (!state.savedOnly || saved.has(p.page)) &&
    (!state.q || (p.name + " " + p.section + " " + p.colors.join(" ")).toLowerCase().includes(state.q)));

  const grid = $("#grid");
  grid.className = "";
  grid.innerHTML = list.length ? "" : '<p class="empty">No palettes match — loosen a filter.</p>';
  list.forEach((p, i) => {
    const drawing = drawFrom === p.page;
    const n = sysOf(p.page).length;
    const card = el("article", "card" + (drawing ? " drawing" : ""));
    card.style.animationDelay = Math.min(i, 16) * 30 + "ms";
    const bands = p.colors.map((c) => {
      const on = drawing && open && (open.accent.includes(c) || open.core === c);
      return `<button class="band ${lum(c) > 0.55 ? "dk" : "lt"}${on ? " on" : ""}" style="background:${c}"
        data-hex="${c}" aria-label="${esc(drawing ? "Add " + c + " to " + open.name : "Copy " + c)}"><span>${c}</span></button>`;
    }).join("");
    card.innerHTML = `
      <div class="bands ${p.colors.length > 12 ? "many" : ""}">${bands}</div>
      <footer>
        <div class="row1"><h3>${p.name}</h3><span class="page">${pageLabel(p)}</span></div>
        <div class="row2">
          <span class="sec">${p.section}</span>
          <span class="acts">
            <button class="save" aria-pressed="${saved.has(p.page)}" aria-label="Save palette">${saved.has(p.page) ? "Saved" : "Save"}</button>
            <button class="cpy">Copy</button>
            <button class="exp">Export</button>
            ${picking && open
              /* the open system's own page lends nothing and must not re-open a sibling mid-pick */
              ? (open.page === p.page ? ""
                : `<button class="draw" aria-pressed="${drawing}">${drawing ? "Done" : "Draw from"}</button>`)
              : `<button class="bld">${n ? `Build (${n})` : "Build"}</button>`}
          </span>
        </div>
      </footer>`;
    card.querySelectorAll(".band").forEach((b) => (b.onclick = () =>
      drawing ? drawAccent(b.dataset.hex, p.page) : copy(b.dataset.hex, b.dataset.hex + " copied")));
    card.querySelector(".save").onclick = () => { saved.has(p.page) ? saved.delete(p.page) : saved.add(p.page); persist(); render(); };
    card.querySelector(".cpy").onclick = () => copy(p.colors.join(", "), "palette copied");
    card.querySelector(".exp").onclick = () => openExport(p);
    card.querySelector(".bld")?.addEventListener("click", () => openFor(p));
    card.querySelector(".draw")?.addEventListener("click", () => { drawFrom = drawing ? null : p.page; render(); });
    grid.append(card);
  });
  $("#meta").textContent = `${list.length} of ${PALETTES.length} palettes · ${sections.length} sections · ${PALETTES.reduce((n, p) => n + p.colors.length, 0)} colours`;
}

/* ---------- the shelf: systems, recognisable by their colours and their name ---------- */
function renderShelf() {
  const grid = $("#grid");
  grid.className = "shelf";
  if (!systems.length) {
    grid.innerHTML = '<p class="empty">No systems yet — open a palette and press build.</p>';
    $("#meta").textContent = `0 systems`;
    return;
  }
  grid.innerHTML = "";
  systems.forEach((s, i) => {
    const p = byPage.get(s.page);
    const n = neutralOf(s);
    /* the brand colours, then the three neutral steps that actually build the page — without them
       two candidates that differ only by neutral are the reason you pinned them and look identical */
    const strip = [s.core, ...orderedOf(s)].filter(Boolean).slice(0, 4)
      .concat(n ? ["bg", "surface", "text"].map((r) => n.colors[readStep(s, r)]) : []);
    const card = el("article", "card" + (pinned.has(s.id) ? " pin" : ""));
    card.style.animationDelay = Math.min(i, 16) * 30 + "ms";
    card.innerHTML = `
      <div class="shelfstrip">${strip.length
        ? strip.map((c) => `<i style="background:${c}"></i>`).join("")
        : '<i style="background:var(--bg-3)"></i>'}</div>
      <footer>
        <div class="row1"><h3>${esc(s.name)}</h3><span class="page">${esc(s.at)}</span></div>
        <div class="row2">
          <span class="sec">${p ? p.name + " · " + pageLabel(p) : "p. " + s.page}${s.neutral ? " · " + esc(s.neutral) : ""} · ${s.dark ? "dark" : "light"}</span>
        </div>
        <div class="row2">
          <span class="acts">
            <button class="op">Open</button>
            <button class="pn" aria-pressed="${pinned.has(s.id)}">${pinned.has(s.id) ? "Pinned" : "Pin"}</button>
            <button class="dl">Delete</button>
          </span>
          ${pinned.size > 1 ? '<button class="cmpBtn acts" style="font:inherit;background:none;border:none;cursor:pointer;color:var(--ink-hi);font-size:13px;font-weight:500">Compare ' + pinned.size + '</button>' : ""}
        </div>
      </footer>`;
    card.querySelector(".op").onclick = () => { open = s; tab = "build"; drawFrom = null; picking = false; state.view = "grid"; render(); };
    card.querySelector(".pn").onclick = () => {
      pinned.has(s.id) ? pinned.delete(s.id) : pinned.size < 3 ? pinned.add(s.id) : toast("three is the ceiling — unpin one");
      render();
    };
    card.querySelector(".dl").onclick = () => {
      if (!confirm(`Delete “${s.name}”?`)) return;
      systems = systems.filter((x) => x.id !== s.id);
      pinned.delete(s.id);
      if (open?.id === s.id) open = null;
      persistSystems(); render();
    };
    card.querySelector(".cmpBtn")?.addEventListener("click", openCompare);
    grid.append(card);
  });
  $("#meta").textContent = `${systems.length} system${systems.length === 1 ? "" : "s"} · ${pinned.size} pinned`;
}

/* ---------- copy + toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const t = $("#toast");
  t.textContent = msg;
  if (undo) {
    const b = el("button", "tundo", "undo");
    b.onclick = () => { t.classList.remove("show"); undo(); };
    t.append(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), undo ? 6000 : 1600);
}
/* a moment of undo instead of a confirm dialog: snapshot the open record, mutate, offer the way back */
function withUndo(msg, mutate) {
  const before = structuredClone(open);
  mutate();
  persistSystems();
  renderRail();
  toast(msg, () => {
    const i = systems.findIndex((x) => x.id === before.id);
    if (i < 0) return;
    systems[i] = before;
    if (open && open.id === before.id) open = before;
    persistSystems();
    render();
  });
}

/* ---------- drag: one pointer engine — tray reorder, drag-off removal, ramp→role drops ----------
   Native pointer events, no library. A fine pointer lifts after 6px of travel; touch lifts on a
   300ms hold so a swipe is never mistaken for a drag (handles are touch-action:none, so nothing
   scrolls from them either way). Nothing mutates until the drop, so no re-render can destroy the
   node mid-gesture. Every drag has a click/keyboard twin — this is sugar, never the only door. */
let drag = null;
function draggable(node, spec) {
  node.classList.add("grab");
  node.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || drag) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    const touch = e.pointerType === "touch";
    let lifted = false, over = null, timer = 0;
    const lift = () => {
      lifted = true;
      try { node.setPointerCapture(pid); } catch {}
      const ghost = el("div", "dghost", `<i style="background:${spec.color}"></i><span>${esc(spec.label)}</span><b class="gbadge"></b>`);
      ghost.style.transform = `translate(${sx + 12}px, ${sy + 14}px)`;
      document.body.append(ghost);
      node.classList.add("lifting");
      document.body.classList.add("dragging");
      drag = { ghost, cancel: finish };
    };
    const move = (ev) => {
      if (!lifted) {
        const d = Math.hypot(ev.clientX - sx, ev.clientY - sy);
        if (touch) { if (d > 12) finish(); return; } /* moved before the hold — not a drag */
        if (d <= 6) return;
        lift();
      }
      drag.ghost.style.transform = `translate(${ev.clientX + 12}px, ${ev.clientY + 14}px)`;
      const hit = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("[data-drop]") || null;
      if (over && over !== hit) over.classList.remove("dropok", "dropbad");
      over = hit;
      const b = spec.canDrop(hit);
      if (hit && b) { hit.classList.toggle("dropok", b.ok); hit.classList.toggle("dropbad", !b.ok); }
      drag.ghost.querySelector(".gbadge").textContent = b ? (b.ok ? "" : "⚠ ") + b.text : "";
    };
    const finish = () => {
      clearTimeout(timer);
      node.removeEventListener("pointermove", move);
      node.removeEventListener("pointerup", up);
      node.removeEventListener("pointercancel", finish);
      over?.classList.remove("dropok", "dropbad");
      if (lifted) {
        drag.ghost.remove();
        node.classList.remove("lifting");
        document.body.classList.remove("dragging");

/* ---------- export ---------- */
const slug = (p) => p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

const key = (p, i) => p.names?.[i] ?? `${slug(p)}-${i + 1}`;
/* PDF p.4 — what each tier is for; only meaningful on a built system */
const GUIDE = ["core — key brand moments, used with discipline", "accent — sparingly, for emphasis", "neutral — structure, backgrounds and body copy"];
/* The header is the only part of a build that survives into a meeting three weeks later — the CSS file is
   what's open in the room, not this app. So it carries where it came from, what was ruled out, and the

const cmt = (l) => String(l).replace(/\s*[\r\n]+\s*/g, " ").replace(/\*\//g, "* /");

  (p.names ? [
    `${p.name} · ${p.src} · ${p.dark ? "dark" : "light"} theme`,

  css:  { ext: "css",  make: (p) => `${guide(p, "/* ", " */")}:root {\n${p.colors.map((c, i) => `  --${key(p, i)}: ${c};`).join("\n")}\n}` },
  scss: { ext: "scss", make: (p) => guide(p, "// ") + p.colors.map((c, i) => `$${key(p, i)}: ${c};`).join("\n") },
  tailwind: { ext: "js", make: (p) => `${guide(p, "// ")}colors: {\n  "${slug(p)}": {\n${p.colors.map((c, i) => `    "${p.names?.[i] ?? i + 1}": "${c}",`).join("\n")}\n  },\n},` },
  json: { ext: "json", make: (p) => JSON.stringify({ name: p.name, section: p.section, page: p.page, colors: p.colors,

function openExport(p) {

}
function setFormat(f) {
  dlgFormat = f;
  $("#dlgTabs").innerHTML = "";
  $("#dlgTabs").append(...Object.keys(FORMATS).map((k) => {
    const b = el("button", "chip"); b.textContent = k;
    b.setAttribute("aria-pressed", k === f);

/* ---------- build a system (PDF pp. 4–5) ---------- */
const NEUTRALS = PALETTES.filter((p) => p.section === "Neutrals");

   Resolved in one place so nothing downstream renders, or crashes on, a ghost. */
const neutralOf = (s) => NEUTRALS.find((x) => x.name === s.neutral) || null;

/* Which step of the 11-wide neutral ramp each role reads, in the light theme.
   text-muted sits at 4, not 5: every scale lands 4.35–4.39 at step 5, which the grader above
   calls "large text only". Step 4 reads 6.9–7.2 in light and — because dark is these indices
   mirrored — 6.8–6.9 in dark. One number, both themes. The role ladder can move any of these. */
const ROLE_STEP = { bg: 10, surface: 9, border: 8, "text-muted": 4, text: 1 };
const ROLES = Object.keys(ROLE_STEP);
/* the pairing each role is judged on, and whether WCAG text rules apply to it.

const PAIR = {
  bg: ["text", "text on bg", true], surface: ["text-muted", "muted on surface", true],
  border: ["surface", "border on surface", false],
  "text-muted": ["surface", "muted on surface", true], text: ["bg", "text on bg", true],

const stepOf = (s, role) => s.roles?.[role] ?? ROLE_STEP[role];

/* accent order is derived — board column, then step. Never click order: the ordinal ends up
   in a CSS file where it looks semantic, so it has to be a fact about the colour. */
function ordered(s) {
  const p = byPage.get(s.page);

  return s.accent.slice().sort((a, b) => rankIn(cols, a) - rankIn(cols, b));
}
/* a dragged order wins where one exists; anything it doesn't cover keeps its derived rank.
   No order recorded → exactly the derived order, so an untouched build exports byte for byte. */
function orderedOf(s) {
  if (!Array.isArray(s.order) || !s.order.length) return ordered(s);
  const ord = s.order.filter((c) => s.accent.includes(c));

  return ord;
}
/* every page this system drew from, in the order it drew from them */
function sources(s) {
  const p = byPage.get(s.page);
  const out = [p ? `${p.name} ${isBrand(p) ? "· brand" : "p. " + s.page}` : `p. ${s.page}`];
  const extra = [...new Set(s.accent.map((c) => s.src[c]).filter((pg) => pg && pg !== s.page))];
  extra.forEach((pg) => out.push(byPage.get(pg)
    ? `${byPage.get(pg).name} ${isBrand(byPage.get(pg)) ? "· brand" : "p. " + pg}` : `p. ${pg}`));
  if (s.neutral) { const n = neutralOf(s); out.push(`${s.neutral} p. ${n ? n.page : "?"}`); }
  return out.join(" + ");
}

function system(p, s) {
  const n = neutralOf(s);
  const acc = orderedOf(s);
  const colors = [], names = [];
  if (s.core) { colors.push(s.core); names.push("core"); }
  acc.forEach((c, i) => { colors.push(c); names.push(`accent-${i + 1}`); });
  n?.colors.forEach((c, i) => { colors.push(c); names.push(`neutral-${i + 1}`); });
  /* semantic roles — the same hexes again, named for the job they do; neutrals run dark→light, 11 steps */
  const roleAt = colors.length;
  const roles = {}, steps = {};
  if (n) ROLES.forEach((r) => { const i = readStep(s, r); roles[r] = n.colors[i]; steps[r] = `neutral-${i + 1}`; });
  if (s.core) roles["core-ink"] = ink(s.core);
  /* one ink per accent. A single --accent-ink was taken from accent-1 and was wrong for every accent
     on the other side of the threshold — p.135 shipped white on #FFFFFF. The preview already paints
     each tag with its own ink(); the export now says the same thing. */
  acc.forEach((c, i) => (roles[`accent-${i + 1}-ink`] = ink(c)));
  Object.entries(roles).forEach(([k, c]) => { colors.push(c); names.push(k); });
  /* the contrast question gets asked in every room and is pure arithmetic — compute it, never ask her to record it */
  const checks = [];
  if (n) checks.push(`text on bg ${contrast(roles.text, roles.bg)}`, `muted on surface ${contrast(roles["text-muted"], roles.surface)}`);
  if (s.core) checks.push(`ink on core ${contrast(roles["core-ink"], s.core)}`);
  /* the tally is arithmetic about THIS page. Accents drawn from another page — and colours a
     regenerated colors.js no longer prints — are counted apart instead of inflating the numerator,
     which is what turned "3 of 27 chosen" into a claim about colours p.72 does not contain. */
  const here = (c) => !!p && p.colors.includes(c);
  const home = (s.core && here(s.core) ? 1 : 0) + s.accent.filter(here).length;
  const away = (s.core ? 1 : 0) + s.accent.length - home;

    name: s.name, section: p?.section ?? "", page: s.page, colors, names, neutral: n, roles, steps, roleAt,
    dark: !!s.dark, checks, src: sources(s), eliminated: s.out.length,
    tally: p ? `${home} of ${p.colors.length} chosen · ${s.out.length} eliminated${away ? ` · ${away} from other pages` : ""}` : "",
    stepline: n ? "roles read " + ROLES.map((r) => `${r}=${steps[r]}`).join(" ") : "",

/* ---------- shareable build link ----------
   v2 carries the name, the role overrides and what was eliminated, so a link reproduces the export
   byte for byte. v1's readable #b= is still decoded — links already in the wild have to keep working. */
const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  "#b2=" + b64(JSON.stringify([s.page, s.name, s.core, s.accent, s.neutral, s.dark ? 1 : 0, s.roles, s.out, s.src,

      const ord = hexes(order);

        order: ord.length ? ord : null });

/* ---------- opening, duplicating, closing ---------- */
function openFor(p) {

$("#rClose").onclick = () => { open = null; drawFrom = null; picking = false; render(); };

$("#delCancel").onclick = () => $("#delDlg").close();
$("#delDlg").onclick = (e) => { if (e.target === $("#delDlg")) $("#delDlg").close(); };
$("#delOk").onclick = () => {

document.querySelectorAll(".rtabs .chip").forEach((b) =>
  (b.onclick = () => { tab = b.dataset.tab; renderRail(); }));

/* ---------- the three swatch states of PDF p.5 ---------- */
const roleOf = (s, hex) => (s.core === hex ? "core" : s.accent.includes(hex) ? "accent" : s.out.includes(hex) ? "out" : "open");

/* first click sets the core; after that the cap (or C) moves it and the old core falls back to an
   accent, in place. No release step, so the preview never collapses between two clicks. */
function setCore(hex) {
  if (open.core === hex) return;

  open.out = open.out.filter((c) => c !== hex);
  delete open.src[hex]; /* src is keyed on accents; a leftover entry drops a page from the header */
  if (prev && !open.accent.includes(prev)) open.accent.push(prev);

  if (open.accent.includes(hex)) { open.accent = open.accent.filter((c) => c !== hex); delete open.src[hex]; }
  else { open.accent.push(hex); open.src[hex] = page; }

/* ---------- tray mutations: remove, reorder — one gesture each, every one undoable or derivable back ---------- */
function removeAccent(hex) {
  withUndo(`${hex} removed`, () => {

  const cell = $("#rBody").querySelector(sel);
  if (!cell) return toast(open?.src[hex] ? `drawn from p. ${open.src[hex]}` : "not on this page");

/* ---------- the rail ---------- */
function renderRail() {

  document.body.classList.toggle("pick", !!open && picking);
  const back = $("#backChip");
  back.hidden = !(open && picking);
  if (!back.hidden) back.textContent = "← back to " + open.name;
  /* the system in miniature rides along while she browses other pages for an accent */
  const ps = $("#pickSys");
  ps.hidden = back.hidden;
  if (!ps.hidden) ps.innerHTML = [open.core, ...orderedOf(open)].filter(Boolean)
    .map((c) => `<i style="background:${c}"></i>`).join("");
  $("#rPrevPane").innerHTML = "";   /* the export tab leaves it empty, and an empty pane takes no height */
  if (!open) { $("#rBody").innerHTML = ""; $("#rAct").innerHTML = ""; $("#rProg").innerHTML = ""; return; }
  const s = open, p = byPage.get(s.page);

  $("#rSrc").textContent = sources(s);

  /* focus survives a rebuild — the rail is keyboard-driven and losing your place mid-edit is unusable.

/* the method as a strip in the header: each segment is a fact, and a link to the stage that changes it */

    [`${s.out.length} out`, s.out.length > 0, "b1"],
